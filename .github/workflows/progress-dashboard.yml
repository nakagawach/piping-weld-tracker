name: Progress Dashboard Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - app.py
      - templates/projects.html
      - templates/progress_dashboard.html
      - tests/progress_dashboard_e2e.py
      - .github/workflows/progress-dashboard.yml

jobs:
  dashboard-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Install browser test dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Python syntax check
        run: python -m py_compile app.py tests/progress_dashboard_e2e.py

      - name: Progress dashboard regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/progress_dashboard_e2e.py

      - name: Shared UI shell regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/ui_shell_e2e.py

      - name: Progress fixed workspace regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/progress_fixed_workspace_production_e2e.py
