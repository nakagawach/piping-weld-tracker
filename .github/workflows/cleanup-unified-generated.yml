name: Clean generated unified verification files
on:
  push:
    branches: [rebuild/unified-progress-entry-ui]
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Clean generated verification files'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated files only
        run: |
          rm -rf __pycache__ tests/__pycache__
          rm -f data/weld_tracker.sqlite3
          rm .github/workflows/cleanup-unified-generated.yml
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Remove generated verification artifacts'
          git push origin HEAD:rebuild/unified-progress-entry-ui
