name: Apply V1.1 header refinement

on:
  push:
    branches:
      - rebuild/v1.1-features-header
    paths:
      - .github/workflows/v11-header-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V1.1 feature baseline
        run: |
          set -euo pipefail
          grep -q 'id="bboxEdit"' templates/project_entry.html
          grep -q 'bboxActionAt' templates/project_entry.html
          grep -q 'drawingMemoLaunch' progress.py
          grep -q 'navigateProgressPage' progress.py
          grep -q 'drawingMemoEdit' static/progress_drawing_memo.js
          grep -q '図面エントリーへ' global_favorites.py
          python -m py_compile progress.py ui_shell.py tools/apply_v11_header.py
          node --check static/progress_drawing_memo.js

      - name: Apply patch
        run: python tools/apply_v11_header.py

      - name: Verify intended diff
        run: |
          set -euo pipefail
          python -m py_compile progress.py ui_shell.py
          node --check static/progress_drawing_memo.js
          grep -q 'progress-thumb.active:disabled' progress.py
          grep -q "aria-current','page" progress.py
          grep -q '@media(min-width:821px)' ui_shell.py
          grep -q 'id="bboxEdit"' templates/project_entry.html
          grep -q 'drawingMemoEdit' static/progress_drawing_memo.js
          grep -q '図面エントリーへ' global_favorites.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'progress.py'
          test "${changed[1]}" = 'ui_shell.py'

      - name: Commit intended files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress.py ui_shell.py
          git commit -m 'Refine V1.1 responsive header and page states'
          git push origin HEAD:rebuild/v1.1-features-header
