name: Cleanup navigation pycache

on:
  push:
    branches:
      - fix/navigation-context-current

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[pycache-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove generated files only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __pycache__
          rm .github/workflows/cleanup-navigation-pycache.yml
          git diff --name-status
          test -z "$(git diff --name-only | grep -v '^\.github/workflows/cleanup-navigation-pycache.yml$' | grep -v '^__pycache__/' || true)"
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated pycache from navigation PR [pycache-clean]'
          git push origin HEAD:fix/navigation-context-current
