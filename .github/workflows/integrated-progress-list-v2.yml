name: Integrated Progress List V2 Checks

on:
  push:
    branches:
      - feature/integrated-progress-list-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          python -m py_compile app.py progress.py projects.py global_favorites.py
          node --check static/progress_list_panel.js
      - name: Integrated progress list V2 browser E2E
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/integrated_progress_list_v2_e2e.py
      - name: Existing UI shell regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/ui_shell_e2e.py
