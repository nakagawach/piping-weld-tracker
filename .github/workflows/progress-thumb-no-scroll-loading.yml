name: Progress Thumbnail No Scroll Loading

on:
  push:
    branches:
      - fix/progress-thumb-no-scroll-loading-v3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          python -m py_compile app.py progress.py ui_shell.py
      - name: No thumbnail loading from scroll
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/progress_thumb_no_scroll_loading_e2e.py
      - name: Pager and disabled thumbnail regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/progress_nav_verified_e2e.py
      - name: Existing UI shell regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/ui_shell_e2e.py
