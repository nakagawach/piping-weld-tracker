name: Live Progress Thumbnail Diagnostic

on:
  push:
    branches:
      - fix/progress-thumb-no-scroll-loading-v3

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Diagnose live PythonAnywhere progress thumbnail scrolling
        run: python tests/live_progress_thumb_diagnostic.py
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-progress-thumb-diagnostic
          path: test-artifacts/*.png
          if-no-files-found: ignore
