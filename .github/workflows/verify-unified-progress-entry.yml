name: Verify unified Progress and Entry rebuild
on:
  push:
    branches: [rebuild/unified-progress-entry-ui]
jobs:
  verify:
    if: github.event.head_commit.message == 'Add unified verification workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Static protection checks
        run: |
          python -m py_compile app.py progress.py ui_shell.py desktop_ui_shell.py projects.py project_render.py thumbnail_grid.py global_favorites.py
          python tests/test_drawing_memo.py
          grep -q 'cursor:not-allowed' templates/project_entry.html
          grep -q 'bboxEdit' templates/project_entry.html
          grep -q 'drawingMemoLaunch' progress.py
          grep -q '__drawingMemoBeforePageChange' static/progress_drawing_memo.js
          grep -q 'ui3-switch' ui_shell.py
          git diff --check 59731e005e927c359da91f1851498305c27628ab...HEAD
      - name: Existing mobile Chromium regression
        run: python tests/ui_shell_e2e.py
      - name: Existing desktop Chromium regression
        run: python tests/ui_shell_desktop_e2e.py
      - name: Unified Progress Entry regression
        run: python tests/unified_progress_entry_e2e.py
      - name: WebKit smoke
        run: |
          python - <<'PY'
          import sys,time
          sys.path.insert(0,'tests')
          from playwright.sync_api import sync_playwright, expect
          from ui_shell_e2e import BASE_URL,PROJECT_ID,run_server,seed_database
          seed_database(); server,thread=run_server(); time.sleep(.2)
          try:
            with sync_playwright() as p:
              browser=p.webkit.launch(); page=browser.new_page(viewport={'width':390,'height':844})
              page.goto(f'{BASE_URL}/projects/{PROJECT_ID}/progress?page=1',wait_until='domcontentloaded')
              expect(page.locator('[data-ui3-header="progress"]')).to_be_visible()
              expect(page.locator('#drawingMemoLaunch')).to_have_count(1)
              page.goto(f'{BASE_URL}/projects/{PROJECT_ID}/entry?page=1',wait_until='domcontentloaded')
              expect(page.locator('[data-ui3-header="entry"]')).to_be_visible()
              expect(page.locator('#bboxEdit')).to_have_count(1)
              expect(page.locator('#ocr')).to_be_visible(); expect(page.locator('#save')).to_be_visible()
              browser.close()
          finally:
            server.shutdown(); thread.join(timeout=2)
          print('WebKit smoke: PASS')
          PY
      - name: Remove temporary verification workflow
        run: |
          rm .github/workflows/verify-unified-progress-entry.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Finalize unified Progress and Entry rebuild'
          git push origin HEAD:rebuild/unified-progress-entry-ui
