name: Verify Integrated Progress List on PythonAnywhere

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  public-browser:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/verify-progress-list-public'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          echo "sha=$(jq -r '.head.sha' <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.head.ref' <<<"$json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Public PythonAnywhere read-only browser E2E
        env:
          PYTHONPATH: ${{ github.workspace }}
          PUBLIC_BASE_URL: https://nakagawach.pythonanywhere.com/weld
        run: python tests/public_integrated_progress_list_e2e.py
