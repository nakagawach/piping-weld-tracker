name: Fixed Progress Workspace Mock Checks

on:
  push:
    branches:
      - mock/fixed-progress-workspace
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          python -m py_compile app.py
      - name: Fixed workspace mock E2E
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/mock_fixed_progress_layout_e2e.py
