name: Temporary Production Progress Diagnostic

on:
  push:
    branches:
      - feature/progress-fixed-workspace-production
    paths:
      - .github/workflows/temp-progress-production-diagnostic.yml

permissions:
  contents: read

jobs:
  read-only-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser diagnostic dependency
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compare production list and page APIs for triangle project P4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          origin="https://nakagawach.pythonanywhere.com/weld"

          def get_json(path):
              req=urllib.request.Request(origin+path,headers={"Cache-Control":"no-cache","Pragma":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=json.load(r)
                  headers={k.lower():v for k,v in r.headers.items()}
              return body,headers

          projects,_=get_json("/projects")
          matches=[p for p in projects.get("projects",[]) if p.get("projectName")=="△工事" or p.get("project_name")=="△工事"]
          if len(matches)!=1:
              safe=[{"id":p.get("id"),"name":p.get("projectName") or p.get("project_name")} for p in projects.get("projects",[])]
              print("triangle_matches",len(matches))
              print("project_names",json.dumps(safe,ensure_ascii=False))
              raise SystemExit(2)

          pid=matches[0]["id"]
          listing,lh=get_json(f"/projects/{pid}/progress-list-data?_diag=1")
          page,ph=get_json(f"/projects/{pid}/progress-data?page=4&_diag=1")
          p4=[x for x in listing.get("items",[]) if int(x.get("pageNumber") or 0)==4]
          out={
              "project_id":pid,
              "list_p4_count":len(p4),
              "list_p4_numbers":[x.get("number") for x in p4],
              "page_saved":page.get("saved"),
              "page_candidate_count":len(page.get("candidates",[])),
              "page_candidate_numbers":[x.get("number") for x in page.get("candidates",[])],
              "list_cache_control":lh.get("cache-control"),
              "page_cache_control":ph.get("cache-control"),
          }
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY

      - name: Reproduce production P4 in Chromium read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          url="https://nakagawach.pythonanywhere.com/weld/projects/5/progress?page=1"
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={"width":390,"height":844})
              seen=[]
              page.on("response",lambda r: seen.append({
                  "url":r.url,
                  "status":r.status
              }) if "/progress-data" in r.url else None)
              page.goto(url,wait_until="domcontentloaded")
              page.locator("#progressListPanel").wait_for(state="visible",timeout=15000)
              page.locator("#progressThumbs .progress-thumb[data-page='4']").click()
              page.wait_for_function("document.getElementById('page').value === '4'",timeout=15000)
              page.wait_for_timeout(1800)
              diag=page.evaluate("""()=>({
                page:document.getElementById('page').value,
                canvasHidden:document.getElementById('canvas').hidden,
                emptyHidden:document.getElementById('empty').hidden,
                emptyText:document.getElementById('empty').textContent,
                candidateCount:document.querySelector('#summary')?.textContent || '',
                activeThumb:document.querySelector('.progress-thumb.active')?.dataset.page || null,
                statusText:document.getElementById('status')?.textContent || ''
              })""")
              print("browser_dom",json.dumps(diag,ensure_ascii=False))
              print("browser_progress_responses",json.dumps(seen,ensure_ascii=False))
              browser.close()
          PY
