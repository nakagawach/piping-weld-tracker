name: Temporary Production Progress Diagnostic

on:
  push:
    branches:
      - feature/progress-fixed-workspace-production
    paths:
      - .github/workflows/temp-progress-production-diagnostic.yml

permissions:
  contents: read

jobs:
  read-only-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser diagnostic dependency
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compare production list and page APIs for triangle project P4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          origin="https://nakagawach.pythonanywhere.com/weld"

          def get_json(path):
              req=urllib.request.Request(origin+path,headers={"Cache-Control":"no-cache","Pragma":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=json.load(r)
                  headers={k.lower():v for k,v in r.headers.items()}
              return body,headers

          projects,_=get_json("/projects")
          matches=[p for p in projects.get("projects",[]) if p.get("projectName")=="△工事" or p.get("project_name")=="△工事"]
          if len(matches)!=1:
              safe=[{"id":p.get("id"),"name":p.get("projectName") or p.get("project_name")} for p in projects.get("projects",[])]
              print("triangle_matches",len(matches))
              print("project_names",json.dumps(safe,ensure_ascii=False))
              raise SystemExit(2)

          pid=matches[0]["id"]
          listing,lh=get_json(f"/projects/{pid}/progress-list-data?_diag=1")
          page,ph=get_json(f"/projects/{pid}/progress-data?page=4&_diag=1")
          p4=[x for x in listing.get("items",[]) if int(x.get("pageNumber") or 0)==4]
          out={
              "project_id":pid,
              "list_p4_count":len(p4),
              "list_p4_numbers":[x.get("number") for x in p4],
              "page_saved":page.get("saved"),
              "page_candidate_count":len(page.get("candidates",[])),
              "page_candidate_numbers":[x.get("number") for x in page.get("candidates",[])],
              "list_cache_control":lh.get("cache-control"),
              "page_cache_control":ph.get("cache-control"),
          }
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY

      - name: Reproduce production P4 in Chromium read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          url="https://nakagawach.pythonanywhere.com/weld/projects/5/progress?page=1"
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={"width":390,"height":844})
              seen=[]
              page.on("response",lambda r: seen.append({
                  "url":r.url,
                  "status":r.status
              }) if "/progress-data" in r.url else None)
              page.goto(url,wait_until="domcontentloaded")
              page.locator("#progressListPanel").wait_for(state="visible",timeout=15000)
              page.locator("#progressThumbs .progress-thumb[data-page='4']").click()
              page.wait_for_function("document.getElementById('page').value === '4'",timeout=15000)
              page.wait_for_timeout(1800)
              diag=page.evaluate("""()=>({
                page:document.getElementById('page').value,
                canvasHidden:document.getElementById('canvas').hidden,
                emptyHidden:document.getElementById('empty').hidden,
                emptyText:document.getElementById('empty').textContent,
                candidateCount:document.querySelector('#summary')?.textContent || '',
                activeThumb:document.querySelector('.progress-thumb.active')?.dataset.page || null,
                statusText:document.getElementById('status')?.textContent || ''
              })""")
              print("browser_dom",json.dumps(diag,ensure_ascii=False))
              print("browser_progress_responses",json.dumps(seen,ensure_ascii=False))
              browser.close()
          PY

      - name: Verify Android-like fresh session and initial production layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from playwright.sync_api import sync_playwright

          origin="https://nakagawach.pythonanywhere.com/weld"
          with urllib.request.urlopen(origin+"/projects",timeout=30) as r:
              projects=json.load(r).get("projects",[])
          def pname(p):
              return p.get("projectName") or p.get("project_name")
          sample=next(p for p in projects if pname(p)=="初めのサンプルPDF")
          triangle=next(p for p in projects if pname(p)=="△工事")

          with sync_playwright() as p:
              device=p.devices.get("Pixel 7")
              browser=p.chromium.launch()
              ctx=browser.new_context(**device)
              page=ctx.new_page()

              # Fresh production initial view.
              page.goto(f"{origin}/projects/{sample['id']}/progress?page=1",wait_until="domcontentloaded")
              page.locator("#canvas").wait_for(state="visible",timeout=15000)
              page.locator("#progressListPanel").wait_for(state="visible",timeout=15000)
              page.wait_for_timeout(1200)
              initial=page.evaluate("""()=>{const c=document.getElementById('canvas').getBoundingClientRect(),v=document.getElementById('viewer').getBoundingClientRect(),s=document.getElementById('progressSplitter').getBoundingClientRect();return{
                page:document.getElementById('page').value,
                canvasHidden:document.getElementById('canvas').hidden,
                emptyHidden:document.getElementById('empty').hidden,
                minimap:document.getElementById('progressMinimap').classList.contains('show'),
                listOpen:document.body.classList.contains('progress-list-open'),
                canvas:{x:c.x,y:c.y,w:c.width,h:c.height},
                viewer:{x:v.x,y:v.y,w:v.width,h:v.height},
                splitter:{x:s.x,y:s.y,w:s.width,h:s.height}
              }}""")
              print("android_initial",json.dumps(initial,ensure_ascii=False))
              assert initial["page"]=="1"
              assert initial["canvasHidden"] is False
              assert initial["emptyHidden"] is True
              assert initial["minimap"] is False
              assert initial["listOpen"] is True
              assert initial["canvas"]["w"] <= initial["viewer"]["w"]+3
              assert initial["canvas"]["h"] <= initial["viewer"]["h"]+3

              # Fresh Android-like triangle P4.
              page.goto(f"{origin}/projects/{triangle['id']}/progress?page=1",wait_until="domcontentloaded")
              page.locator("#progressThumbs .progress-thumb[data-page='4']").click()
              page.wait_for_function("document.getElementById('page').value === '4'",timeout=15000)
              page.wait_for_timeout(1200)
              tri=page.evaluate("""()=>({
                page:document.getElementById('page').value,
                canvasHidden:document.getElementById('canvas').hidden,
                emptyHidden:document.getElementById('empty').hidden,
                summary:document.getElementById('summary').textContent,
                activeThumb:document.querySelector('.progress-thumb.active')?.dataset.page||null
              })""")
              print("android_triangle_p4",json.dumps(tri,ensure_ascii=False))
              assert tri["page"]=="4"
              assert tri["canvasHidden"] is False
              assert tri["emptyHidden"] is True
              assert tri["activeThumb"]=="4"
              assert "全 11" in tri["summary"]

              ctx.close()
              browser.close()
          PY

      - name: Verify saved rotation and PC fresh production layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from playwright.sync_api import sync_playwright

          origin="https://nakagawach.pythonanywhere.com/weld"
          with urllib.request.urlopen(origin+"/projects",timeout=30) as r:
              projects=json.load(r).get("projects",[])
          def pname(p): return p.get("projectName") or p.get("project_name")
          sample=next(p for p in projects if pname(p)=="初めのサンプルPDF")
          sid=sample["id"]

          with sync_playwright() as p:
              browser=p.chromium.launch()

              # Android-like session with persisted 270deg rotation.
              device=p.devices.get("Pixel 7")
              ctx=browser.new_context(**device)
              page=ctx.new_page()
              page.goto(origin+"/projects-screen",wait_until="domcontentloaded")
              page.evaluate(f"localStorage.setItem('weldDrawingRotation:{sid}','270')")
              page.goto(f"{origin}/projects/{sid}/progress?page=1",wait_until="domcontentloaded")
              page.locator("#canvas").wait_for(state="visible",timeout=15000)
              page.wait_for_timeout(1200)
              rot=page.evaluate("""()=>{const c=document.getElementById('canvas').getBoundingClientRect(),v=document.getElementById('viewer').getBoundingClientRect();return{
                rotate:document.getElementById('rotate').textContent,
                minimap:document.getElementById('progressMinimap').classList.contains('show'),
                emptyHidden:document.getElementById('empty').hidden,
                canvas:{w:c.width,h:c.height},viewer:{w:v.width,h:v.height}
              }}""")
              print("android_saved_rotation",json.dumps(rot,ensure_ascii=False))
              assert "270" in rot["rotate"]
              assert rot["minimap"] is False
              assert rot["emptyHidden"] is True
              assert rot["canvas"]["w"]<=rot["viewer"]["w"]+3
              assert rot["canvas"]["h"]<=rot["viewer"]["h"]+3
              ctx.close()

              # Wide PC fresh production view.
              pc=browser.new_page(viewport={"width":1440,"height":900})
              pc.goto(f"{origin}/projects/{sid}/progress?page=1",wait_until="domcontentloaded")
              pc.locator("#canvas").wait_for(state="visible",timeout=15000)
              pc.locator("#progressListPanel").wait_for(state="visible",timeout=15000)
              pc.wait_for_timeout(1000)
              pd=pc.evaluate("""()=>{const c=document.getElementById('canvas').getBoundingClientRect(),v=document.getElementById('viewer').getBoundingClientRect(),p=document.getElementById('progressListPanel').getBoundingClientRect();return{
                minimap:document.getElementById('progressMinimap').classList.contains('show'),
                listOpen:document.body.classList.contains('progress-list-open'),
                canvas:{w:c.width,h:c.height},viewer:{w:v.width,h:v.height},panel:{w:p.width,h:p.height}
              }}""")
              print("pc_initial",json.dumps(pd,ensure_ascii=False))
              assert pd["minimap"] is False
              assert pd["listOpen"] is True
              assert pd["canvas"]["w"]<=pd["viewer"]["w"]+3
              assert pd["canvas"]["h"]<=pd["viewer"]["h"]+3
              assert 330<=pd["panel"]["w"]<=350
              pc.close()
              browser.close()
          PY
