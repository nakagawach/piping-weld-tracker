name: Public Page and Selection Sync Verification

on:
  push:
    branches:
      - fix/progress-page-latest-wins

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Public page and selection sync final
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/public_page_and_selection_sync_final.py
