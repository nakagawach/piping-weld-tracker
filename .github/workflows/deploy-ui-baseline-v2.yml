name: Deploy clean UI baseline v2

on:
  push:
    branches:
      - fix/ui-baseline-v2-clean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pythonanywhere-weld
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Syntax check
        run: python -m py_compile app.py projects.py project_render.py progress.py thumbnail_grid.py global_favorites.py ui_baseline.py

      - name: OCR regression tests
        shell: bash
        run: |
          python - <<'PY'
          from project_render import extract_label_candidates, normalize_label
          expected={"①":"1","Ｆ１":"F1","S2":"S2","A-12":"A-12","F1-2":"F1-2","12A":"12A"}
          for raw,value in expected.items(): assert normalize_label(raw)==value
          assert normalize_label("SCALE") is None
          words=[{"text":"F","vertices":[{"x":0,"y":0},{"x":10,"y":0},{"x":10,"y":12},{"x":0,"y":12}]},{"text":"1","vertices":[{"x":12,"y":0},{"x":18,"y":0},{"x":18,"y":12},{"x":12,"y":12}]}]
          assert "F1" in {x["number"] for x in extract_label_candidates(words)}
          print("OCR regression passed")
          PY

      - name: Verify UI protection rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'create_ui_baseline_blueprint' app.py
          grep -q 'data-weld-ui-v2' ui_baseline.py
          grep -q 'project_thumbnail_grid_v2.html' thumbnail_grid.py
          grep -q 'data-thumbnail-grid-launch' thumbnail_grid.py
          grep -q 'aria-label="ページ一覧"' thumbnail_grid.py
          grep -q 'data-page-favorite-view' thumbnail_grid.py
          grep -q 'data-go-favorites' global_favorites.py
          grep -q '★ お気に入りページ一覧' global_favorites.py
          grep -q 'controls.querySelector.\x27\[data-go-favorites\]\x27' ui_baseline.py || grep -q "controls.querySelector('\[data-go-favorites\]')" ui_baseline.py
          grep -q 'uiKeepLeft=viewer.scrollLeft' ui_baseline.py
          grep -q 'viewer=1' ui_baseline.py
          grep -q 'ui2-grid' ui_baseline.py
          grep -q 'ui2-cols' ui_baseline.py
          if grep -q "dataset.uiFavs\|data-ui-favs" ui_baseline.py; then echo 'UI baseline must not create a second favorites action'; exit 1; fi
          if grep -q "図面エントリーへ.*menu.append" ui_baseline.py; then echo 'UI baseline must reuse the existing progress menu'; exit 1; fi

      - name: Upload weld app files
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://www.pythonanywhere.com/api/v0/user/nakagawach/files/path/home/nakagawach/piping-weld-tracker"
          upload_file(){ local file="$1"; echo "Uploading ${file}"; curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" -F "content=@${file}" "${api_base}/${file}"; }
          upload_file app.py
          upload_file projects.py
          upload_file project_render.py
          upload_file progress.py
          upload_file thumbnail_grid.py
          upload_file global_favorites.py
          upload_file ui_baseline.py
          upload_file requirements.txt
          while IFS= read -r -d '' file; do upload_file "$file"; done < <(find templates -type f -print0)
          if [ -d static ]; then while IFS= read -r -d '' file; do upload_file "$file"; done < <(find static -type f -print0); fi
          test -n "${GOOGLE_VISION_API_KEY:-}"
          printf 'GOOGLE_VISION_API_KEY=%s\n' "$GOOGLE_VISION_API_KEY" > .env
          upload_file .env

      - name: Reload PythonAnywhere
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" "https://www.pythonanywhere.com/api/v0/user/nakagawach/webapps/nakagawach.pythonanywhere.com/reload/"

      - name: Smoke test all primary screens
        shell: bash
        run: |
          set -euo pipefail
          fetch(){ curl --fail --silent --show-error --location --max-time 25 "$1" || true; }
          for attempt in 1 2 3 4 5 6; do
            projects=$(fetch 'https://nakagawach.pythonanywhere.com/weld/projects-screen')
            progress=$(fetch 'https://nakagawach.pythonanywhere.com/weld/projects/7/progress?page=1')
            viewer=$(fetch 'https://nakagawach.pythonanywhere.com/weld/projects/7/progress?page=1&viewer=1')
            entry=$(fetch 'https://nakagawach.pythonanywhere.com/weld/projects/7/entry?page=1')
            thumbs=$(fetch 'https://nakagawach.pythonanywhere.com/weld/projects/7/thumbnails?source=progress&page=1')
            favorites=$(fetch 'https://nakagawach.pythonanywhere.com/weld/favorites')
            plist=$(fetch 'https://nakagawach.pythonanywhere.com/weld/projects/7/progress-list')
            if [[ "$projects" == *'data-weld-ui-v2'* ]] && [[ "$progress" == *'data-weld-ui-v2'* ]] && [[ "$progress" == *'data-thumbnail-grid-launch'* ]] && [[ "$progress" == *'data-page-favorite-view'* ]] && [[ "$entry" == *'data-weld-ui-v2'* ]] && [[ "$entry" == *'data-thumbnail-grid-launch'* ]] && [[ "$thumbs" == *'ページ一覧'* ]] && [[ "$thumbs" == *'data-weld-ui-v2'* ]] && [[ "$favorites" == *'お気に入りページ'* ]] && [[ "$favorites" == *'data-weld-ui-v2'* ]] && [[ "$plist" == *'進捗一覧'* ]] && [[ "$viewer" == *'ui-viewer-mode-v2'* ]]; then
              echo 'Smoke test passed'; exit 0
            fi
            echo "Smoke attempt $attempt failed"; sleep 5
          done
          exit 1
