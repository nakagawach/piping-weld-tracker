name: Bootstrap navigation context current

on:
  push:
    branches:
      - fix/navigation-context-current

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[nav-bootstrap-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited navigation files onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/ui-navigation-audit
          for file in progress.py templates/project_progress.html templates/project_entry.html templates/project_progress_list.html tests/public_ui_navigation_regression.py; do
            mkdir -p "$(dirname "$file")"
            git show origin/fix/ui-navigation-audit:"$file" > "$file"
          done

          python - <<'PY'
          from pathlib import Path

          p = Path('templates/project_progress.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('button:disabled{opacity:.55;cursor:wait}', 'button:disabled{opacity:.55;cursor:not-allowed}')
          p.write_text(s, encoding='utf-8')

          # Respect ?page=N when opening Progress/Entry from lists or explicit links.
          for filename in ['templates/project_progress.html', 'templates/project_entry.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if filename.endswith('project_progress.html'):
                  old = "pageCount=data.pageCount;pageTotal.textContent=`/ ${pageCount}`;setBusy(false);await loadPage(1)"
                  new = "pageCount=data.pageCount;pageTotal.textContent=`/ ${pageCount}`;setBusy(false);const initialPage=Math.max(1,Math.min(pageCount,Number(new URLSearchParams(location.search).get('page'))||1));await loadPage(initialPage)"
              else:
                  old = "pageCount=Number(data.pageCount)||0;if(!pageCount)throw new Error('PDFのページ数を取得できませんでした。');pageInput.max=pageCount;setupThumbnails();return loadPage(1);"
                  new = "pageCount=Number(data.pageCount)||0;if(!pageCount)throw new Error('PDFのページ数を取得できませんでした。');pageInput.max=pageCount;setupThumbnails();const initialPage=Math.max(1,Math.min(pageCount,Number(new URLSearchParams(location.search).get('page'))||1));return loadPage(initialPage);"
              if old not in s:
                  raise SystemExit(f'initial-page anchor not found in {filename}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/bootstrap-navigation-context-current.yml

          python -m py_compile app.py projects.py project_render.py progress.py thumbnail_grid.py global_favorites.py ui_shell.py desktop_ui_shell.py viewer_mode.py
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "progress.py templates/project_entry.html templates/project_progress.html templates/project_progress_list.html tests/public_ui_navigation_regression.py "

      - name: Commit clean navigation change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress.py templates/project_progress.html templates/project_entry.html templates/project_progress_list.html tests/public_ui_navigation_regression.py .github/workflows/bootstrap-navigation-context-current.yml
          git commit -m 'Apply navigation context fixes on current main [nav-bootstrap-done]'
          git push origin HEAD:fix/navigation-context-current
