name: Temporary All Pages Production Diagnostic

on:
  push:
    branches:
      - feature/progress-fixed-workspace-production
    paths:
      - .github/workflows/temp-all-pages-production-diagnostic.yml

permissions:
  contents: read

jobs:
  read-only-all-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify triangle project all pages API and browser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from collections import Counter
          from playwright.sync_api import sync_playwright

          origin="https://nakagawach.pythonanywhere.com/weld"
          pid=5

          def get_json(path):
              req=urllib.request.Request(origin+path,headers={"Cache-Control":"no-cache","Pragma":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          listing=get_json(f"/projects/{pid}/progress-list-data?_diag_all=1")
          by_page={}
          for item in listing.get("items",[]):
              p=int(item.get("pageNumber") or 0)
              by_page.setdefault(p,[]).append(str(item.get("number")))

          api=[]
          for pno in range(1,9):
              data=get_json(f"/projects/{pid}/progress-data?page={pno}&_diag_all=1")
              nums=[str(x.get("number")) for x in data.get("candidates",[])]
              row={
                  "page":pno,
                  "saved":bool(data.get("saved")),
                  "candidate_count":len(nums),
                  "candidate_numbers":nums,
                  "list_count":len(by_page.get(pno,[])),
                  "list_numbers":by_page.get(pno,[]),
                  "same_multiset":Counter(nums)==Counter(by_page.get(pno,[])),
              }
              api.append(row)
          print("all_pages_api",json.dumps(api,ensure_ascii=False))

          with sync_playwright() as p:
              device=p.devices.get("Pixel 7")
              browser=p.chromium.launch()
              ctx=browser.new_context(**device)
              page=ctx.new_page()
              page.goto(f"{origin}/projects/{pid}/progress?page=1",wait_until="domcontentloaded")
              page.locator("#progressListPanel").wait_for(state="visible",timeout=15000)
              results=[]
              for pno in range(1,9):
                  if pno != 1:
                      page.locator(f"#progressThumbs .progress-thumb[data-page='{pno}']").click()
                  page.wait_for_function(f"document.getElementById('page').value === '{pno}'",timeout=15000)
                  page.wait_for_timeout(700)
                  d=page.evaluate("""()=>({
                    page:document.getElementById('page').value,
                    canvasHidden:document.getElementById('canvas').hidden,
                    emptyHidden:document.getElementById('empty').hidden,
                    emptyText:document.getElementById('empty').textContent,
                    activeThumb:document.querySelector('.progress-thumb.active')?.dataset.page||null,
                    summary:document.getElementById('summary')?.textContent||'',
                    status:document.getElementById('status')?.textContent||''
                  })""")
                  results.append(d)
              print("all_pages_browser",json.dumps(results,ensure_ascii=False))
              browser.close()
          PY
