name: Update navigation UI regression expectation

on:
  push:
    branches:
      - fix/navigation-context-current

permissions:
  contents: write

jobs:
  update-test:
    if: ${{ !contains(github.event.head_commit.message, '[nav-test-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only progress-list URL expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ui_shell_e2e.py')
          s=p.read_text(encoding='utf-8')
          old='page.wait_for_url(f"**/projects/{PROJECT_ID}/progress-list")'
          new='page.wait_for_url(f"**/projects/{PROJECT_ID}/progress-list?page=1")'
          if s.count(old) != 1:
              raise SystemExit(f'expected one old URL assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/update-navigation-ui-test.yml
          git diff --check
          changed="$(git diff --name-only | sort | grep -v '^\.github/workflows/update-navigation-ui-test.yml$' | tr '\n' ' ')"
          test "$changed" = "tests/ui_shell_e2e.py "
      - name: Commit test expectation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update navigation regression for preserved page query [nav-test-updated]'
          git push origin HEAD:fix/navigation-context-current
