name: Public iPad Right Panel Toolbar Verification

on:
  push:
    branches:
      - fix/ipad-right-panel-toolbar

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Public iPad toolbar verification
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/public_ipad_right_panel_toolbar.py
