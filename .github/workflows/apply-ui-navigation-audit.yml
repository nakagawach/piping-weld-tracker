name: Apply UI Navigation Audit Patch

on:
  push:
    branches:
      - fix/ui-navigation-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply navigation audit fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-navigation-audit
          fetch-depth: 0

      - name: Apply exact navigation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Entry: separate navigation from actual page reload.
          replace_once(
              'templates/project_entry.html',
              '  let thumbObserver = null;\n',
              '  let thumbObserver = null;\n  let loadedPage = 0;\n'
          )
          replace_once(
              'templates/project_entry.html',
              "button.addEventListener('click',()=>loadPage(p));",
              "button.addEventListener('click',()=>navigatePage(p));"
          )
          replace_once(
              'templates/project_entry.html',
              "  async function loadPage(pageNumber){if(!pageCount||busy)return;if(!confirmLeave())return;const n=Math.max(1,Math.min(pageCount,Number(pageNumber)||1));pageInput.value=n;",
              "  function navigatePage(pageNumber){if(!pageCount||busy)return;const n=Math.max(1,Math.min(pageCount,Number(pageNumber)||1));if(n===loadedPage){pageInput.value=String(loadedPage||n);return;}if(!confirmLeave()){pageInput.value=String(loadedPage||n);return;}loadPage(n);}\n  async function loadPage(pageNumber){if(!pageCount||busy)return;const n=Math.max(1,Math.min(pageCount,Number(pageNumber)||1));pageInput.value=n;"
          )
          replace_once(
              'templates/project_entry.html',
              "savedPage=Boolean(data.saved);dirty=false;draw();ocrButton.textContent=data.saved?'再OCR':'OCR実行';",
              "savedPage=Boolean(data.saved);dirty=false;loadedPage=n;draw();ocrButton.textContent=data.saved?'再OCR':'OCR実行';"
          )
          replace_once(
              'templates/project_entry.html',
              "prev.onclick=()=>loadPage(Number(pageInput.value)-1);next.onclick=()=>loadPage(Number(pageInput.value)+1);pageInput.onchange=()=>loadPage(pageInput.value);ocrButton.onclick=runOcr;",
              "prev.onclick=()=>navigatePage((loadedPage||Number(pageInput.value))-1);next.onclick=()=>navigatePage((loadedPage||Number(pageInput.value))+1);pageInput.onchange=()=>navigatePage(pageInput.value);ocrButton.onclick=runOcr;"
          )

          # Progress: keep explicit reload, guard navigation-only controls.
          replace_once(
              'templates/project_progress.html',
              "  let pageCount=0,candidates=[],progressMap=new Map(),active=null,busy=false,selectedStatus='未着手',drawingZoom=1,rotation=0,cssFullscreen=false;\n",
              "  let pageCount=0,candidates=[],progressMap=new Map(),active=null,busy=false,selectedStatus='未着手',drawingZoom=1,rotation=0,cssFullscreen=false,loadedPage=0;\n"
          )
          replace_once(
              'templates/project_progress.html',
              "  async function loadPage(n){if(busy||!pageCount)return;n=Math.max(1,Math.min(pageCount,Number(n)||1));pageInput.value=n;",
              "  function navigatePage(n){if(busy||!pageCount)return;const target=Math.max(1,Math.min(pageCount,Number(n)||1));if(target===loadedPage){pageInput.value=String(loadedPage||target);return;}loadPage(target);}\n  async function loadPage(n){if(busy||!pageCount)return;n=Math.max(1,Math.min(pageCount,Number(n)||1));pageInput.value=n;"
          )
          replace_once(
              'templates/project_progress.html',
              "candidates=data.candidates||[];progressMap=new Map((data.items||[]).map(x=>[keyFromXY(x.x,x.y),x]));if(!data.saved||!candidates.length)",
              "candidates=data.candidates||[];progressMap=new Map((data.items||[]).map(x=>[keyFromXY(x.x,x.y),x]));loadedPage=n;if(!data.saved||!candidates.length)"
          )
          replace_once(
              'templates/project_progress.html',
              "prev.onclick=()=>loadPage(Number(pageInput.value)-1);next.onclick=()=>loadPage(Number(pageInput.value)+1);reload.onclick=()=>loadPage(Number(pageInput.value));document.getElementById('reloadCompact').onclick=()=>{document.getElementById('moreMenu').open=false;loadPage(Number(pageInput.value))};pageInput.onchange=()=>loadPage(Number(pageInput.value));",
              "prev.onclick=()=>navigatePage((loadedPage||Number(pageInput.value))-1);next.onclick=()=>navigatePage((loadedPage||Number(pageInput.value))+1);reload.onclick=()=>loadPage(loadedPage||Number(pageInput.value));document.getElementById('reloadCompact').onclick=()=>{document.getElementById('moreMenu').open=false;loadPage(loadedPage||Number(pageInput.value))};pageInput.onchange=()=>navigatePage(pageInput.value);"
          )

          # Progress-generated thumbnails and progress-list link preserve current page.
          replace_once(
              'progress.py',
              "f'<a class=\"button icon-button\" href=\"{progress_list_url}\" '",
              "f'<a class=\"button icon-button\" id=\"progressListButton\" data-base-href=\"{progress_list_url}\" href=\"{progress_list_url}?page=1\" '"
          )
          replace_once(
              'progress.py',
              '"const progressThumbs=document.getElementById(\'progressThumbs\');let progressThumbObserver=null;"',
              '"const progressThumbs=document.getElementById(\'progressThumbs\'),progressListButton=document.getElementById(\'progressListButton\');let progressThumbObserver=null;"'
          )
          replace_once(
              'progress.py',
              "function updateProgressThumbActive(){progressThumbs.querySelectorAll('.progress-thumb').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===Number(pageInput.value)));const n=Number(pageInput.value);ensureProgressThumbLoaded(n);",
              "function updateProgressThumbActive(){progressThumbs.querySelectorAll('.progress-thumb').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===Number(pageInput.value)));const n=Number(pageInput.value);if(progressListButton){progressListButton.href=`${progressListButton.dataset.baseHref}?page=${n}`;}ensureProgressThumbLoaded(n);"
          )
          replace_once(
              'progress.py',
              "b.onclick=()=>loadPage(p);",
              "b.onclick=()=>navigatePage(p);"
          )
          replace_once(
              'progress.py',
              "    def project_progress_list(project_id):\n        with connect() as connection:",
              "    def project_progress_list(project_id):\n        current_page = max(1, request.args.get(\"page\", default=1, type=int) or 1)\n        with connect() as connection:"
          )
          replace_once(
              'progress.py',
              '            pdf_name=project["original_pdf_name"],\n        )\n\n    @blueprint.get("/projects/<int:project_id>/progress-list-data")',
              '            pdf_name=project["original_pdf_name"],\n            current_page=current_page,\n        )\n\n    @blueprint.get("/projects/<int:project_id>/progress-list-data")'
          )

          # Desktop progress-list back also keeps page context.
          replace_once(
              'templates/project_progress_list.html',
              '<a class="back" href="{{ url_for(\'progress.project_progress\', project_id=project_id) }}">‹ 図面へ</a>',
              '<a class="back" href="{{ url_for(\'progress.project_progress\', project_id=project_id) }}?page={{ current_page }}">‹ 図面へ</a>'
          )

          # Standard deploy must actually deploy shared header code.
          replace_once(
              '.github/workflows/deploy-pythonanywhere.yml',
              'run: python -m py_compile app.py projects.py project_render.py progress.py thumbnail_grid.py global_favorites.py',
              'run: python -m py_compile app.py projects.py project_render.py progress.py thumbnail_grid.py global_favorites.py ui_shell.py'
          )
          replace_once(
              '.github/workflows/deploy-pythonanywhere.yml',
              '          upload_file "global_favorites.py"\n          upload_file "requirements.txt"',
              '          upload_file "global_favorites.py"\n          upload_file "ui_shell.py"\n          upload_file "requirements.txt"'
          )
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile app.py projects.py project_render.py progress.py thumbnail_grid.py global_favorites.py ui_shell.py
          grep -q 'navigatePage' templates/project_progress.html
          grep -q 'navigatePage' templates/project_entry.html
          grep -q 'progressListButton' progress.py
          grep -q 'current_page=current_page' progress.py
          grep -q 'ui_shell.py' .github/workflows/deploy-pythonanywhere.yml
          git diff --check

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-ui-navigation-audit.yml
          git config user.name "nakagawach"
          git config user.email "85813915+nakagawach@users.noreply.github.com"
          git add progress.py templates/project_progress.html templates/project_entry.html templates/project_progress_list.html .github/workflows/deploy-pythonanywhere.yml tests/public_ui_navigation_regression.py .github/workflows/apply-ui-navigation-audit.yml
          git commit -m "Apply navigation audit fixes"
          git push origin HEAD:fix/ui-navigation-audit
