name: Deploy mobile fullscreen v8

on:
  push:
    branches:
      - fix/mobile-fullscreen-v8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pythonanywhere-weld
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Syntax check
        run: python -m py_compile ios_fullscreen_v8.py global_favorites.py

      - name: Verify isolated iOS fullscreen guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-ios-fullscreen-v8' ios_fullscreen_v8.py
          grep -q 'position:absolute' ios_fullscreen_v8.py
          grep -q '100lvh' ios_fullscreen_v8.py
          if grep -q 'position:fixed' ios_fullscreen_v8.py; then echo 'fixed positioning must not be used in iOS v8'; exit 1; fi
          grep -q "stopImmediatePropagation" ios_fullscreen_v8.py
          grep -q "zoomIn.click()" ios_fullscreen_v8.py
          grep -q 'create_ios_fullscreen_v8_blueprint' global_favorites.py

      - name: Upload isolated test files
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://www.pythonanywhere.com/api/v0/user/nakagawach/files/path/home/nakagawach/piping-weld-tracker"
          upload_file(){ local file="$1"; curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" -F "content=@${file}" "${api_base}/${file}"; }
          upload_file ios_fullscreen_v8.py
          upload_file global_favorites.py

      - name: Reload PythonAnywhere
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST \
            -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/nakagawach/webapps/nakagawach.pythonanywhere.com/reload/"

      - name: Smoke test public UI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            progress=$(curl --fail --silent --show-error --location --max-time 20 "https://nakagawach.pythonanywhere.com/weld/projects/7/progress" || true)
            if [[ "$progress" == *'data-ios-fullscreen-v8'* ]] && [[ "$progress" == *'data-responsive-header-v7'* ]] && [[ "$progress" == *'ios-fullscreen-v8-exit'* ]]; then
              echo "Smoke test passed"; exit 0
            fi
            sleep 5
          done
          exit 1
