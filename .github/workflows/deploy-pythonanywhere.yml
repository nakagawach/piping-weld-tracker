name: Deploy weld app to PythonAnywhere

on:
  push:
    branches:
      - feature/deploy-automation
      - feature/google-vision-ocr
      - feature/manual-number-map-editor
      - feature/drawing-region-ocr
      - feature/highres-single-ocr
      - feature/manual-number-correction-ui
      - feature/always-edit-entry-ui
      - feature/save-number-map
      - feature/weld-progress-entry
      - feature/project-pdf-registration-safe
      - feature/project-delete
      - feature/project-entry-after-delete
      - feature/project-entry-ocr
      - feature/project-entry-auto-area
      - feature/project-entry-fast-display
      - feature/project-entry-adaptive-area
      - feature/pdfium-project-entry
      - feature/pdfium-cache-server-ocr-v2
      - feature/ocr-label-candidates
      - feature/project-progress-input
      - feature/project-progress-local-zoom
      - feature/progress-compact-viewer-ui
      - fix/entry-hit-area-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pythonanywhere-weld
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Syntax check
        shell: bash
        run: python -m py_compile app.py projects.py project_render.py progress.py

      - name: OCR label candidate tests
        shell: bash
        run: |
          python - <<'PY'
          from project_render import extract_label_candidates, normalize_label

          expected = {
              "①": "1",
              "㊿": "50",
              "❶": "1",
              "Ｆ１": "F1",
              "S2": "S2",
              "A-12": "A-12",
              "F1-2": "F1-2",
              "12A": "12A",
          }
          for raw, normalized in expected.items():
              assert normalize_label(raw) == normalized, (raw, normalize_label(raw))
          assert normalize_label("SCALE") is None
          assert normalize_label("3979") is None

          words = [
              {"text": "F", "vertices": [{"x": 0, "y": 0}, {"x": 10, "y": 0}, {"x": 10, "y": 12}, {"x": 0, "y": 12}]},
              {"text": "1", "vertices": [{"x": 12, "y": 0}, {"x": 18, "y": 0}, {"x": 18, "y": 12}, {"x": 12, "y": 12}]},
          ]
          labels = {item["number"] for item in extract_label_candidates(words)}
          assert "F1" in labels, labels
          print("OCR label candidate tests passed")
          PY

      - name: Upload weld app files
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://www.pythonanywhere.com/api/v0/user/nakagawach/files/path/home/nakagawach/piping-weld-tracker"
          upload_file() {
            local file="$1"
            echo "Uploading ${file}"
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 \
              -X POST \
              -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" \
              -F "content=@${file}" \
              "${api_base}/${file}"
          }
          upload_file "app.py"
          upload_file "projects.py"
          upload_file "project_render.py"
          upload_file "progress.py"
          upload_file "requirements.txt"
          while IFS= read -r -d '' file; do upload_file "$file"; done < <(find templates -type f -print0)
          if [ -d static ]; then while IFS= read -r -d '' file; do upload_file "$file"; done < <(find static -type f -print0); fi
          if [ -z "${GOOGLE_VISION_API_KEY:-}" ]; then echo "GOOGLE_VISION_API_KEY secret is not configured."; exit 1; fi
          printf 'GOOGLE_VISION_API_KEY=%s\n' "$GOOGLE_VISION_API_KEY" > .env
          upload_file ".env"

      - name: Reload PythonAnywhere web app
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" "https://www.pythonanywhere.com/api/v0/user/nakagawach/webapps/nakagawach.pythonanywhere.com/reload/"

      - name: Smoke test weld app
        shell: bash
        run: |
          set -euo pipefail
          fetch_text() {
            curl --fail --silent --show-error --location --max-time 20 "$1" || true
          }
          for attempt in 1 2 3 4 5 6; do
            page_ok=false; map_ok=false; progress_ok=false; projects_screen_ok=false; projects_api_ok=false; pdfium_ok=false; project_progress_ok=false; project_entry_ok=false

            page_html=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/")
            [[ "$page_html" == *"溶接進捗入力テスト"* ]] && page_ok=true

            map_json=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/number-map?page=1")
            [[ "$map_json" == *'"pageNumber":1'* ]] && map_ok=true

            progress_json=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/weld-progress?page=1")
            [[ "$progress_json" == *'"pageNumber":1'* ]] && progress_ok=true

            projects_html=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/projects-screen")
            [[ "$projects_html" == *"工事一覧"* ]] && projects_screen_ok=true

            projects_json=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/projects")
            [[ "$projects_json" == *'"projects"'* ]] && projects_api_ok=true
            project_id=$(printf '%s' "$projects_json" | python -c 'import json,sys; d=json.load(sys.stdin); p=d.get("projects",[]); print(p[0]["id"] if p else "")' 2>/dev/null || true)

            if [ -z "$project_id" ]; then
              pdfium_ok=true; project_progress_ok=true; project_entry_ok=true
            else
              pdfium_info=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/projects/${project_id}/pdfium-info")
              if [[ "$pdfium_info" == *'"pageCount"'* ]] && curl --fail --silent --show-error --location --max-time 30 "https://nakagawach.pythonanywhere.com/weld/projects/${project_id}/pdfium-page?page=1&longEdge=500&format=png" --output /dev/null; then pdfium_ok=true; fi

              project_progress_html=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/projects/${project_id}/progress")
              project_progress_json=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/projects/${project_id}/progress-data?page=1")
              if [[ "$project_progress_html" == *"進捗入力"* ]] && [[ "$project_progress_json" == *'"pageNumber":1'* ]]; then project_progress_ok=true; fi

              project_entry_html=$(fetch_text "https://nakagawach.pythonanywhere.com/weld/projects/${project_id}/entry")
              if [[ "$project_entry_html" == *"図面エントリー"* ]] && [[ "$project_entry_html" == *"project_id"* || "$project_entry_html" == *"pdfium-info"* ]]; then project_entry_ok=true; fi
            fi

            echo "smoke: page=$page_ok map=$map_ok progress=$progress_ok projects_screen=$projects_screen_ok projects_api=$projects_api_ok pdfium=$pdfium_ok project_progress=$project_progress_ok project_entry=$project_entry_ok project_id=${project_id:-none}"
            if [ "$page_ok" = true ] && [ "$map_ok" = true ] && [ "$progress_ok" = true ] && [ "$projects_screen_ok" = true ] && [ "$projects_api_ok" = true ] && [ "$pdfium_ok" = true ] && [ "$project_progress_ok" = true ] && [ "$project_entry_ok" = true ]; then echo "Smoke test passed."; exit 0; fi
            echo "Smoke test attempt ${attempt} failed; retrying..."; sleep 5
          done
          echo "Smoke test failed after retries."
          exit 1
