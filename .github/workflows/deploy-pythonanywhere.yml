name: Deploy weld app to PythonAnywhere

on:
  push:
    branches:
      - feature/deploy-automation
      - feature/pdf-number-detection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pythonanywhere-weld
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare browser libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/vendor
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            -o static/vendor/opencv.js \
            "https://docs.opencv.org/4.10.0/opencv.js"
          test -s static/vendor/opencv.js
          echo "OpenCV.js size: $(wc -c < static/vendor/opencv.js) bytes"

      - name: Upload weld app files
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          api_base="https://www.pythonanywhere.com/api/v0/user/nakagawach/files/path/home/nakagawach/piping-weld-tracker"

          upload_file() {
            local file="$1"
            echo "Uploading ${file}"
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 \
              -X POST \
              -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" \
              -F "content=@${file}" \
              "${api_base}/${file}"
          }

          upload_file "app.py"
          upload_file "requirements.txt"

          while IFS= read -r -d '' file; do
            upload_file "$file"
          done < <(find templates -type f -print0)

          if [ -d static ]; then
            while IFS= read -r -d '' file; do
              upload_file "$file"
            done < <(find static -type f -print0)
          fi

      - name: Reload PythonAnywhere web app
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: Token ${PYTHONANYWHERE_API_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/nakagawach/webapps/nakagawach.pythonanywhere.com/reload/"

      - name: Smoke test weld app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --max-time 20 \
              "https://nakagawach.pythonanywhere.com/weld/" \
              | grep -q "溶接進捗管理"; then
              echo "Smoke test passed."
              exit 0
            fi
            echo "Smoke test attempt ${attempt} failed; retrying..."
            sleep 5
          done

          echo "Smoke test failed after retries."
          exit 1
