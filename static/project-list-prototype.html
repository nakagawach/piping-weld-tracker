<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理 - 工事一覧</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6f8; color: #202124; }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
    .header { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); }
    .sub { margin: 6px 0 0; color: #5f6368; }
    .primary { min-height: 44px; border: 0; border-radius: 9px; padding: 0 16px; background: #1967d2; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .card { background: #fff; border: 1px solid #dadce0; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .project-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
    .project-title { margin: 0; font-size: 1.15rem; }
    .pdf-name { margin: 6px 0 0; color: #5f6368; overflow-wrap: anywhere; }
    .badge { flex: none; padding: 5px 9px; border-radius: 999px; background: #e8f0fe; color: #174ea6; font-size: .82rem; font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
    .stat { background: #f8f9fa; border-radius: 10px; padding: 12px; }
    .stat-label { color: #5f6368; font-size: .82rem; }
    .stat-value { margin-top: 4px; font-size: 1.1rem; font-weight: 700; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    .button { min-height: 42px; border: 1px solid #bdc1c6; border-radius: 8px; padding: 0 14px; background: #fff; color: #202124; font: inherit; cursor: pointer; }
    .button.open { border-color: #1967d2; color: #1967d2; font-weight: 700; }
    dialog { width: min(520px, calc(100vw - 32px)); border: 0; border-radius: 14px; padding: 0; box-shadow: 0 12px 36px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    .dialog-body { padding: 20px; }
    .dialog-body h2 { margin: 0 0 16px; font-size: 1.2rem; }
    label { display: grid; gap: 6px; margin-bottom: 14px; font-weight: 600; }
    input[type="text"], input[type="file"] { width: 100%; min-height: 44px; padding: 9px 10px; border: 1px solid #bdc1c6; border-radius: 8px; background: #fff; font: inherit; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .note { color: #5f6368; font-size: .88rem; line-height: 1.6; }
    @media (max-width: 640px) {
      .header { align-items: stretch; flex-direction: column; }
      .primary { width: 100%; }
      .stats { grid-template-columns: 1fr; }
      .project-head { flex-direction: column; }
      .actions { justify-content: stretch; }
      .actions .button { flex: 1; }
    }
  </style>
</head>
<body>
<main>
  <div class="header">
    <div>
      <h1>溶接進捗管理</h1>
      <p class="sub">工事一覧</p>
    </div>
    <button class="primary" id="new-project" type="button">＋ 新しい工事を登録</button>
  </div>

  <section class="card" aria-label="工事 sample.pdf">
    <div class="project-head">
      <div>
        <h2 class="project-title">サンプル工事</h2>
        <p class="pdf-name">sample.pdf</p>
      </div>
      <span class="badge">登録済み</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">PDF</div><div class="stat-value">1ファイル</div></div>
      <div class="stat"><div class="stat-label">図面エントリー</div><div class="stat-value">確認中</div></div>
      <div class="stat"><div class="stat-label">施工記録</div><div class="stat-value">入力可能</div></div>
    </div>
    <div class="actions">
      <button class="button" type="button" disabled>詳細</button>
      <button class="button open" id="open-current" type="button">開く</button>
    </div>
  </section>

  <p class="note">これは①「工事一覧・PDF登録」の画面分離確認用です。既存のOCR、番号配置、SQLite保存、施工入力処理には変更を加えていません。</p>
</main>

<dialog id="new-project-dialog">
  <form class="dialog-body" method="dialog">
    <h2>新しい工事を登録</h2>
    <label>工事名
      <input type="text" placeholder="例：○○工場 配管更新工事">
    </label>
    <label>図面PDF
      <input type="file" accept="application/pdf,.pdf">
    </label>
    <p class="note">この段階ではUI確認のみです。登録ボタンを押してもDBやPDFファイルは保存しません。</p>
    <div class="dialog-actions">
      <button class="button" value="cancel">キャンセル</button>
      <button class="primary" value="cancel">登録（試作）</button>
    </div>
  </form>
</dialog>

<script>
  const dialog = document.getElementById('new-project-dialog');
  document.getElementById('new-project').addEventListener('click', () => dialog.showModal());
  document.getElementById('open-current').addEventListener('click', () => {
    window.location.href = '../';
  });
</script>
</body>
</html>
