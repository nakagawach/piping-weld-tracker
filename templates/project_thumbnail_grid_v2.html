<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{ project_name }} - ページ一覧</title><style>*{box-sizing:border-box}:root{color-scheme:light;--blue:#1967d2;--border:#dadce0;--bg:#f5f6f8;--text:#202124;--muted:#5f6368}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}main{max-width:1280px;margin:auto;padding:12px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}.title{margin:0;font-size:1.25rem}.meta{margin-top:3px;color:var(--muted);font-size:.82rem}.button{min-height:42px;padding:0 12px;border:1px solid #bdc1c6;border-radius:9px;background:#fff;color:var(--text);font-weight:700;cursor:pointer}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:11px;margin-bottom:10px}.columns{display:flex;gap:5px}.columns button{min-width:42px;height:38px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;font-weight:800;cursor:pointer}.columns button.active{border-color:var(--blue);background:#e8f0fe;color:#174ea6}.hint{margin-left:auto;color:var(--muted);font-size:.78rem}.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}.page-card{min-width:0;border:2px solid transparent;border-radius:11px;background:#fff;padding:7px;cursor:pointer;box-shadow:0 1px 2px #0001}.page-card:hover{border-color:#aecbfa}.page-card.active{border-color:var(--blue);background:#f8fbff}.page-card:disabled{opacity:.5;cursor:default;pointer-events:none;box-shadow:none}.thumb-wrap{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#f1f3f4;border-radius:7px;overflow:hidden}.thumb{display:none;width:100%;height:100%;object-fit:contain}.placeholder{font-size:.76rem;color:#80868b}.label{margin-top:6px;display:flex;justify-content:space-between;gap:6px;font-size:.8rem;font-weight:800}.loading-note{font-size:.72rem;color:var(--muted);font-weight:600}.error{color:#b3261e}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:640px){main{padding:8px}.title{font-size:1.1rem}.meta{font-size:.76rem}.toolbar{padding:6px;gap:5px}.hint{display:none}.columns{margin-left:auto}.columns button{min-width:38px;height:36px}.grid{gap:7px}.page-card{padding:5px}}</style></head><body><main><div class="top"><div><h1 class="title">ページ一覧</h1><div class="meta">{{ project_name }} / {{ pdf_name }}</div></div><button class="button" id="back" type="button">← 戻る</button></div><div class="toolbar"><strong>表示</strong><div class="columns"><button data-cols="1">1</button><button data-cols="2">2</button><button data-cols="3">3</button><button data-cols="4">4</button></div><span class="hint">表示中を優先し、残りはバックグラウンドで準備</span></div><div class="grid" id="grid"><div class="empty">ページ情報を読み込んでいます…</div></div></main><script>(()=>{const projectId={{ project_id | tojson }};const info={{ url_for('projects.pdfium_info', project_id=project_id) | tojson }};const pageUrl={{ url_for('projects.pdfium_page', project_id=project_id) | tojson }};const entryUrl={{ url_for('projects.project_entry', project_id=project_id) | tojson }};const progressUrl={{ url_for('progress.project_progress', project_id=project_id) | tojson }};const source={{ source | tojson }}==='progress'?'progress':'entry';const currentPage=Math.max(1,Number({{ current_page | tojson }})||1);const grid=document.getElementById('grid');const key=`weldThumbGridCols:${source}`;const MAX_CONCURRENT=2;let cols=matchMedia('(max-width:640px)').matches?2:3,activeLoads=0,backgroundStarted=false;const highQueue=[],normalQueue=[],queued=new Set(),loaded=new Set();try{const n=Number(localStorage.getItem(key));if([1,2,3,4].includes(n))cols=n}catch(_e){}function apply(n){cols=n;grid.style.setProperty('--cols',n);document.querySelectorAll('[data-cols]').forEach(b=>b.classList.toggle('active',Number(b.dataset.cols)===n));try{localStorage.setItem(key,n)}catch(_e){}}document.querySelector('.columns').onclick=e=>{const b=e.target.closest('[data-cols]');if(b)apply(Number(b.dataset.cols))};const target=p=>source==='progress'?`${progressUrl}?page=${p}`:`${entryUrl}?page=${p}`;document.getElementById('back').onclick=()=>location.href=target(currentPage);function setNote(card,text,error=false){const note=card.querySelector('.loading-note');if(!note)return;note.textContent=text;note.classList.toggle('error',error)}function finishLoad(card,p,ok){activeLoads=Math.max(0,activeLoads-1);queued.delete(p);if(ok){loaded.add(p);setNote(card,'');}pump()}function startLoad(card,p,attempt=0){if(loaded.has(p)){finishLoad(card,p,true);return}activeLoads++;setNote(card,attempt?'再試行中…':'読込中…');const img=card.querySelector('img[data-src]');if(!img){finishLoad(card,p,false);return}img.onload=()=>{img.style.display='block';card.querySelector('.placeholder')?.remove();finishLoad(card,p,true)};img.onerror=()=>{img.removeAttribute('src');activeLoads=Math.max(0,activeLoads-1);if(attempt<2){const delay=attempt===0?350:1000;setNote(card,'再試行待ち…');setTimeout(()=>startLoad(card,p,attempt+1),delay)}else{queued.delete(p);setNote(card,'タップで再読込',true);card.dataset.loadFailed='1';pump()}};img.src=img.dataset.src}function pump(){while(activeLoads<MAX_CONCURRENT&&(highQueue.length||normalQueue.length)){const item=highQueue.shift()||normalQueue.shift();if(!item||loaded.has(item.p))continue;startLoad(item.card,item.p)}}function enqueue(card,p,high=false){if(!card||loaded.has(p)||queued.has(p))return;queued.add(p);(high?highQueue:normalQueue).push({card,p});pump()}function startBackground(count){if(backgroundStarted)return;backgroundStarted=true;const run=()=>{for(let p=1;p<=count;p++){const card=grid.querySelector(`.page-card[data-page="${p}"]`);enqueue(card,p,false)}};(window.requestIdleCallback||((cb)=>setTimeout(cb,250)))(run,{timeout:1200})}function render(count){grid.innerHTML='';if(!count){grid.innerHTML='<div class="empty">ページがありません。</div>';return}const ob='IntersectionObserver'in window?new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting){const p=Number(x.target.dataset.page);enqueue(x.target,p,true)}},{rootMargin:'420px 0px'}):null;const f=document.createDocumentFragment();for(let p=1;p<=count;p++){const c=document.createElement('button');c.type='button';c.className='page-card'+(p===currentPage?' active':'');c.dataset.page=String(p);if(p===currentPage){c.disabled=true;c.setAttribute('aria-disabled','true');c.title='現在表示中のページ'}c.innerHTML=`<div class="thumb-wrap"><img class="thumb" decoding="async" data-src="${pageUrl}?page=${p}&longEdge=500&format=jpeg" alt="P${p}"><span class="placeholder">P${p}</span></div><div class="label"><span>P${p}</span><span class="loading-note">待機中</span></div>`;c.onclick=()=>{if(c.disabled)return;if(c.dataset.loadFailed==='1'){c.dataset.loadFailed='';enqueue(c,p,true);return}location.href=target(p)};f.appendChild(c)}grid.appendChild(f);apply(cols);const active=grid.querySelector('.active');if(active){enqueue(active,currentPage,true);for(const p of [currentPage-1,currentPage+1])if(p>=1&&p<=count)enqueue(grid.querySelector(`.page-card[data-page="${p}"]`),p,true);active.scrollIntoView({block:'center'})}if(ob)grid.querySelectorAll('.page-card').forEach(c=>ob.observe(c));else[...grid.children].slice(0,8).forEach(c=>enqueue(c,Number(c.dataset.page),true));startBackground(count)}apply(cols);fetch(info,{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'PDF情報を取得できませんでした。');render(Number(d.pageCount)||0)}).catch(e=>grid.innerHTML=`<div class="empty error">${e.message}</div>`);})();</script></body></html>
