<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ project_name }} - 進捗入力</title>
  <style>
    *{box-sizing:border-box}:root{color-scheme:light;--blue:#1967d2;--green:#188038;--gray:#5f6368;--border:#dadce0;--bg:#f5f6f8;--text:#202124}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}
    main{max-width:1280px;margin:auto;padding:10px 10px 24px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}.title{margin:0;font-size:1.35rem}.meta{margin-top:2px;color:var(--gray);font-size:.84rem;overflow-wrap:anywhere}
    .button{min-height:42px;padding:0 11px;border:1px solid #bdc1c6;border-radius:9px;background:#fff;color:var(--text);cursor:pointer;font-weight:700}.card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .toolbar{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:5;white-space:nowrap}.page-field{display:flex;align-items:center;gap:4px;font-weight:700}.page-field input{width:54px;min-height:40px;padding:0 5px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;text-align:center}.page-total{font-size:.86rem;color:var(--gray);font-weight:700}.spacer{flex:1}.icon-button{min-width:42px;padding:0 8px;font-size:1.05rem}.zoom-value{min-width:58px}.desktop-tools{display:flex;gap:6px;align-items:center}
    .more{position:relative}.more summary{list-style:none;display:flex;align-items:center;justify-content:center;min-width:42px;height:42px;border:1px solid #bdc1c6;border-radius:9px;background:#fff;font-weight:800;cursor:pointer}.more summary::-webkit-details-marker{display:none}.more-menu{position:absolute;right:0;top:47px;z-index:20;width:180px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px #0003}.more-menu .button{display:block;width:100%;margin:3px 0;text-align:left}
    .statusline{padding:5px 9px;color:var(--gray);font-size:.8rem;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{display:flex;gap:5px;overflow-x:auto;padding:5px 7px;border-bottom:1px solid #eee;scrollbar-width:none}.summary::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:4px 8px;border-radius:999px;background:#f1f3f4;font-size:.78rem;font-weight:800;white-space:nowrap}.chip.working{background:#fef7e0;color:#8a4b00}.chip.done{background:#e6f4ea;color:#137333}
    .viewer{overflow:auto;max-height:calc(100vh - 160px);background:#e9eaed;overscroll-behavior:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100%;max-width:none;height:auto;margin:0 auto;background:#fff;touch-action:none;cursor:pointer}body.progress-layout-pending .viewer>#canvas{visibility:hidden!important}.empty{padding:36px 18px;text-align:center;color:var(--gray);line-height:1.7;white-space:pre-line}
    @media(hover:hover) and (pointer:fine){.viewer{cursor:grab}.viewer.mouse-panning{cursor:grabbing}}
    dialog{width:min(560px,calc(100vw - 24px));border:0;border-radius:18px;padding:0;box-shadow:0 18px 48px #0005;max-height:90vh}dialog::backdrop{background:#0007}.sheet{padding:18px;overflow:auto}.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:12px}.sheet h2{margin:0;font-size:1.2rem}.target{margin-top:3px;color:var(--gray)}.close{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:#fff;font-size:1.25rem;cursor:pointer}.label{display:block;font-weight:700;margin:14px 0 7px}.status-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status-button{min-height:54px;border:2px solid var(--border);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}.status-button[data-value="未着手"].active{border-color:#5f6368;background:#f1f3f4}.status-button[data-value="施工中"].active{border-color:#e37400;background:#fef7e0;color:#8a4b00}.status-button[data-value="完了"].active{border-color:#188038;background:#e6f4ea;color:#137333}input[type=date],textarea{width:100%;border:1px solid #bdc1c6;border-radius:10px;background:#fff;padding:11px 12px}input[type=date]{min-height:48px}textarea{min-height:100px;resize:vertical;line-height:1.5}.updated{min-height:1.4em;margin:10px 0 0;color:var(--gray);font-size:.82rem}.error{color:#b3261e}.actions{display:flex;gap:9px;margin-top:14px}.actions .button{flex:1}.save{border-color:var(--blue);background:var(--blue);color:#fff}button:disabled{opacity:.42;cursor:default;pointer-events:none;box-shadow:none}
    body.progress-fullscreen{overflow:hidden;background:#000}body.progress-fullscreen main{max-width:none;height:100vh;height:100dvh;padding:0}body.progress-fullscreen .top{display:none}body.progress-fullscreen .card{height:100vh;height:100dvh;border:0;border-radius:0;display:flex;flex-direction:column}body.progress-fullscreen .toolbar{position:relative;top:auto;flex:0 0 auto}body.progress-fullscreen .statusline{display:none}body.progress-fullscreen .summary{flex:0 0 auto}body.progress-fullscreen .viewer{flex:1;min-height:0;max-height:none}
    @media(max-width:640px){
      main{padding:0}.top{display:none}.card{border:0;border-radius:0}.toolbar{height:48px;padding:3px 5px;gap:4px}.toolbar .button{min-height:40px}.page-field{gap:2px}.page-field>span:first-child{display:none}.page-field input{width:38px;min-height:40px;border:0;background:#f1f3f4;font-weight:800}.page-total{font-size:.78rem}.nav-button{min-width:38px;padding:0 6px;font-size:1.3rem}.desktop-tools{display:none}.compact-rotate,.compact-fullscreen{display:inline-flex;align-items:center;justify-content:center}.more{display:block}.statusline{display:none}.summary{height:31px;padding:3px 6px;gap:4px}.chip{padding:3px 7px;font-size:.73rem}.viewer{max-height:calc(100dvh - 79px);min-height:calc(100dvh - 79px)}
      dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}.sheet{padding:14px 14px 16px}.status-button{min-height:56px;padding:4px;font-size:.95rem}
      body.progress-fullscreen .toolbar{height:48px}body.progress-fullscreen .viewer{max-height:none;min-height:0}
    }
    @media(min-width:641px){.compact-rotate,.compact-fullscreen,.more{display:none}}
  
.progress-list-toggle.active{border-color:#1967d2;background:#e8f0fe;color:#174ea6}
.progress-list-panel{display:none;position:fixed;z-index:40;background:#fff;border:1px solid var(--border);box-shadow:0 10px 30px #0003;overflow:hidden}
body.progress-list-open .progress-list-panel{display:flex;flex-direction:column}
.progress-list-panel .panel-head{height:48px;display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--border)}
.progress-list-panel .panel-head strong{flex:1}.progress-list-panel .panel-state{font-size:.7rem;color:var(--gray)}
.progress-list-panel .panel-collapse{min-width:40px;padding:0;font-size:1.05rem;font-weight:900}
.progress-list-panel.filters-collapsed .panel-filters{display:none}
.progress-list-panel .panel-close{min-width:40px;padding:0;font-size:1.1rem}
.progress-list-panel .panel-filters{padding:8px;border-bottom:1px solid #eee}.progress-list-panel .panel-tabs{display:flex;gap:5px;overflow-x:auto}
.progress-list-panel .panel-tab{min-height:36px;padding:0 10px;border:1px solid #bdc1c6;border-radius:999px;background:#fff;font-weight:800;white-space:nowrap}
.progress-list-panel .panel-tab.active{border-color:#1967d2;background:#e8f0fe;color:#174ea6}
.progress-list-panel .panel-search{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}.progress-list-panel .panel-search input{min-width:0;height:40px;border:1px solid #bdc1c6;border-radius:8px;padding:0 9px}
.progress-list-records{min-height:0;flex:1;overflow:auto}.progress-list-record{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid #eee;background:#fff}
.progress-list-record.current-page{background:#f4f8ff}.progress-list-record.selected{background:#e8f0fe;box-shadow:inset 3px 0 #1967d2}
.progress-list-focus{min-width:0;display:grid;grid-template-columns:48px 66px 38px 1fr;gap:6px;align-items:center;padding:10px 7px 10px 9px;border:0;background:transparent;text-align:left;cursor:pointer}
.progress-list-input{align-self:center;margin-right:7px;min-height:36px;padding:0 9px;border:1px solid #1967d2;border-radius:8px;background:#fff;color:#174ea6;font-size:.74rem;font-weight:900;cursor:pointer;white-space:nowrap}
.progress-list-number{font-weight:900}.progress-list-badge{display:inline-flex;justify-content:center;padding:3px 5px;border-radius:999px;background:#f1f3f4;color:#5f6368;font-size:.72rem;font-weight:900}
.progress-list-badge.working{background:#fef7e0;color:#8a4b00}.progress-list-badge.done{background:#e6f4ea;color:#137333}.progress-list-page{font-size:.75rem;color:#5f6368}.current-page .progress-list-page{color:#174ea6;font-weight:900}
.progress-list-memo{min-width:0;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress-list-empty{padding:30px 14px;text-align:center;color:#5f6368}
.progress-list-foot{padding:7px 9px;border-top:1px solid #eee;color:#5f6368;font-size:.7rem;line-height:1.4}
@media(min-width:901px), (min-width:641px) and (max-width:900px) and (orientation:landscape){
  body.progress-list-open main{max-width:none;padding-right:380px}
  .progress-list-panel{right:10px;top:72px;bottom:10px;width:360px;border-radius:12px}
  body.progress-fullscreen.progress-list-open .progress-list-panel{top:48px}
}
@media(min-width:821px) and (max-width:1200px) and (orientation:landscape){
  body.progress-list-open .toolbar .desktop-tools{display:flex;align-items:center;gap:4px}
  body.progress-list-open .toolbar .desktop-tools>button{display:none}
  body.progress-list-open .toolbar .desktop-tools>#rotate,
  body.progress-list-open .toolbar .desktop-tools>#fullscreen{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
}
@media(max-width:640px), (min-width:641px) and (max-width:900px) and (orientation:portrait){
  .progress-list-panel{left:0;right:0;top:auto;bottom:0;height:50dvh;border-left:0;border-right:0;border-bottom:0;border-radius:16px 16px 0 0}
  body.progress-list-open main{padding-bottom:50dvh}
  body.progress-list-open .viewer{max-height:calc(50dvh - 79px);min-height:0}
  body.progress-fullscreen.progress-list-open main{padding-bottom:50dvh}
  body.progress-fullscreen.progress-list-open .progress-list-panel{top:auto;bottom:0;height:50dvh}
  body.progress-fullscreen.progress-list-open .viewer{max-height:calc(50dvh - 48px);min-height:0}
}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1 class="title">進捗入力</h1><div class="meta">{{ project_name }} / {{ pdf_name }}</div></div><button class="button" id="back" type="button">← 工事一覧へ</button></div>
  <section class="card">
    <div class="toolbar">
      <button class="button nav-button" id="prev" type="button" aria-label="前のページ">‹</button>
      <label class="page-field"><span>ページ</span><input id="page" type="number" min="1" value="1" inputmode="numeric"><span class="page-total" id="pageTotal">/ -</span></label>
      <button class="button nav-button" id="next" type="button" aria-label="次のページ">›</button>
      <div class="spacer"></div><button class="button icon-button progress-list-toggle" id="progressListToggle" type="button" aria-label="進捗一覧" title="進捗一覧">☷</button>
      <div class="desktop-tools" aria-label="図面表示操作"><button class="button" id="zoomOut" type="button">−</button><button class="button zoom-value" id="zoomReset" type="button">100%</button><button class="button" id="zoomIn" type="button">＋</button><button class="button" id="rotate" type="button">↻ 0°</button><button class="button" id="viewReset" type="button">位置リセット</button><button class="button" id="reload" type="button">再読込</button><button class="button" id="fullscreen" type="button">⛶ 全画面</button></div>
      <button class="button icon-button compact-rotate" id="rotateCompact" type="button" aria-label="90度回転">↻</button>
      <button class="button icon-button compact-fullscreen" id="fullscreenCompact" type="button" aria-label="全画面">⛶</button>
      <details class="more" id="moreMenu"><summary aria-label="その他の操作">⋯</summary><div class="more-menu"><button class="button" id="zoomResetCompact" type="button">100%に戻す</button><button class="button" id="viewResetCompact" type="button">位置リセット</button><button class="button" id="reloadCompact" type="button">再読込</button><button class="button" id="backCompact" type="button">工事一覧へ</button></div></details>
    </div>
    <div class="statusline" id="status">図面を読み込んでいます…</div><div class="summary" id="summary" hidden></div>
    <div class="viewer" id="viewer"><canvas id="canvas"></canvas><div class="empty" id="empty" hidden></div><div class="progress-minimap" id="progressMinimap" aria-hidden="true"><canvas id="progressMinimapCanvas"></canvas><div class="progress-minimap-viewport" id="progressMinimapViewport"></div></div></div>
    <div class="progress-splitter" id="progressSplitter" role="separator" aria-orientation="horizontal" aria-label="図面と進捗一覧の高さを調整" tabindex="0"><span aria-hidden="true"></span></div>
    <aside class="progress-list-panel filters-collapsed" id="progressListPanel" data-list-url="{{ url_for('progress.get_project_progress_list', project_id=project_id) }}" aria-label="進捗一覧パネル">
      <div class="panel-head"><strong>進捗一覧</strong><span class="panel-state" id="progressListState">非同期読込</span><button class="button panel-collapse" id="progressListHeaderToggle" type="button" aria-label="絞り込みを開く" aria-expanded="false">∨</button><button class="button panel-close" id="progressListClose" type="button" aria-label="進捗一覧を閉じる">×</button></div>
      <div class="panel-filters"><div class="panel-tabs" id="progressListTabs"><button class="panel-tab active" data-filter="all" type="button">すべて</button><button class="panel-tab" data-filter="未着手" type="button">未着手</button><button class="panel-tab" data-filter="施工中" type="button">施工中</button><button class="panel-tab" data-filter="完了" type="button">完了</button></div><div class="panel-search"><input id="progressListSearch" type="search" placeholder="番号・メモで検索"><button class="button" id="progressListSearchClear" type="button">×</button></div></div>
      <div class="progress-list-records" id="progressListRecords"><div class="progress-list-empty">図面表示後に一覧を読み込みます…</div></div>
      <div class="progress-list-foot">行クリック＝図面位置へ移動・選択。右端「進捗入力」＝そのまま入力。</div>
    </aside>
  </section>
</main>
<dialog id="progressDialog"><form class="sheet" id="progressForm" method="dialog">
  <div class="sheet-head"><div><h2>施工情報</h2><div class="target" id="dialogTarget"></div></div><button class="close" id="closeDialog" type="button" aria-label="閉じる">×</button></div>
  <span class="label">状態</span><div class="status-buttons" id="statusButtons"><button type="button" class="status-button" data-value="未着手">未着手</button><button type="button" class="status-button" data-value="施工中">作業中</button><button type="button" class="status-button" data-value="完了">完了</button></div>
  <label class="label" for="completedDate">完了日</label><input id="completedDate" type="date"><label class="label" for="workDetail">メモ・作業内容</label><textarea id="workDetail" maxlength="1000" placeholder="施工内容、確認事項など"></textarea>
  <div class="updated" id="updated"></div><div class="actions"><button class="button" id="cancel" type="button">キャンセル</button><button class="button save" id="save" type="submit">保存</button></div>
</form></dialog>
<script>
(() => {
  const DISPLAY_LONG_EDGE=1600,SCALE=DISPLAY_LONG_EDGE/6000,HIT_CSS_PX=56;
  const projectId={{ project_id | tojson }};
  const rotationKey=`weldDrawingRotation:${projectId}`;
  let initialRotation=0;
  try{initialRotation=Number(localStorage.getItem(rotationKey)||0)}catch(_e){}
  if(![0,90,180,270].includes(initialRotation))initialRotation=0;
  const progressUrl={{ url_for('progress.get_project_progress', project_id=project_id) | tojson }};
  const saveProgressUrl={{ url_for('progress.save_project_progress', project_id=project_id) | tojson }};
  const pdfiumInfoUrl={{ url_for('projects.pdfium_info', project_id=project_id) | tojson }};
  const pdfiumPageUrl={{ url_for('projects.pdfium_page', project_id=project_id) | tojson }};
  const projectsScreenUrl={{ url_for('projects_screen') | tojson }};
  const pageInput=document.getElementById('page'),pageTotal=document.getElementById('pageTotal'),prev=document.getElementById('prev'),next=document.getElementById('next'),reload=document.getElementById('reload');
  const zoomOut=document.getElementById('zoomOut'),zoomReset=document.getElementById('zoomReset'),zoomIn=document.getElementById('zoomIn'),rotateButton=document.getElementById('rotate'),viewReset=document.getElementById('viewReset'),fullscreenButton=document.getElementById('fullscreen');
  const status=document.getElementById('status'),summary=document.getElementById('summary'),viewer=document.getElementById('viewer'),canvas=document.getElementById('canvas'),empty=document.getElementById('empty');
  const dialog=document.getElementById('progressDialog'),form=document.getElementById('progressForm'),dialogTarget=document.getElementById('dialogTarget');
  const dateInput=document.getElementById('completedDate'),detailInput=document.getElementById('workDetail'),updated=document.getElementById('updated'),saveButton=document.getElementById('save'),source=document.createElement('canvas');
  let pageCount=0,candidates=[],progressMap=new Map(),active=null,busy=false,selectedStatus='未着手',drawingZoom=1,rotation=initialRotation,cssFullscreen=false,selectedTarget=null,selectionPulse=false,selectionPulseToken=0,pendingPanelTarget=null,panelHandling=false,pendingPage=null,requestedPage=1,committedPage=0,lastAutoFitPage=0,desktopFitMode=false;
  let touchMode='',touchMoved=false,touchStartX=0,touchStartY=0,touchStartScrollLeft=0,touchStartScrollTop=0,pinchStartDistance=0,pinchStartZoom=1,suppressClick=false;
  let mousePan=false,mousePanMoved=false,mousePanStartX=0,mousePanStartY=0,mousePanScrollLeft=0,mousePanScrollTop=0;
  rotateButton.textContent=`↻ ${rotation}°`;
  const goBack=()=>location.href=projectsScreenUrl;document.getElementById('back').onclick=goBack;document.getElementById('backCompact').onclick=goBack;document.getElementById('closeDialog').onclick=()=>dialog.close();document.getElementById('cancel').onclick=()=>dialog.close();
  function center(item){return{x:Math.round(item.bbox.x+item.bbox.w/2),y:Math.round(item.bbox.y+item.bbox.h/2)}}function keyFromXY(x,y){return `${Math.round(x)}:${Math.round(y)}`}function key(item){const c=center(item);return keyFromXY(c.x,c.y)}function toDisplayBox(b){return{x:b.x*SCALE,y:b.y*SCALE,w:b.w*SCALE,h:b.h*SCALE}}function statusLabel(v){return v==='施工中'?'作業中':v}
  function markerColor(v){if(v==='完了')return '#188038';if(v==='施工中')return '#e37400';return '#5f6368'}function markerFill(v){if(v==='完了')return 'rgba(24,128,56,.24)';if(v==='施工中')return 'rgba(227,116,0,.25)';return 'rgba(95,99,104,.20)'}
  function setBusy(v){busy=v;pageInput.disabled=v;prev.disabled=v||Number(pageInput.value)<=1;next.disabled=v||!pageCount||Number(pageInput.value)>=pageCount;reload.disabled=v;document.getElementById('reloadCompact').disabled=v}
  function isWideDesktop(){return window.innerWidth>=1201}
  let fitBaseWidth=0;
  function resetPosition(){viewer.scrollLeft=0;viewer.scrollTop=0}
  function applyCanvasZoom(){if(!canvas.width||!fitBaseWidth)return;canvas.style.width=`${Math.max(1,fitBaseWidth*drawingZoom)}px`}
  function requestAdaptiveLayout(options={}){window.dispatchEvent(new CustomEvent('weld:progress-layout-request',{detail:options}))}
  window.__progressFitState={
    getZoom:()=>drawingZoom,
    setFitBaseWidth:(width)=>{fitBaseWidth=Math.max(1,Number(width)||1);applyCanvasZoom()}
  };
  function fitScale(){return 1}
  function applyDesktopFit(){drawingZoom=1;desktopFitMode=true;zoomReset.textContent='Fit ⛶';requestAdaptiveLayout({rebase:true});requestAnimationFrame(resetPosition)}
  function userFitFloor(){return 1}
  function fitPanelViewOnce(){requestAdaptiveLayout({rebase:true})}
  window.addEventListener('weld:progress-fit-request',()=>requestAdaptiveLayout({rebase:true}));
  function setZoom(nextZoom,focalX=null,focalY=null){
    const next=Math.max(1,Math.min(4,nextZoom));
    if(Math.abs(next-drawingZoom)<.001)return;
    const rect=viewer.getBoundingClientRect(),localX=focalX===null?viewer.clientWidth/2:focalX-rect.left,localY=focalY===null?viewer.clientHeight/2:focalY-rect.top,contentX=viewer.scrollLeft+localX,contentY=viewer.scrollTop+localY,ratio=next/drawingZoom;
    drawingZoom=next;desktopFitMode=false;applyCanvasZoom();zoomReset.textContent=`${Math.round(drawingZoom*100)}%`;
    window.dispatchEvent(new CustomEvent('weld:progress-zoom-changed',{detail:{zoom:drawingZoom}}));
    requestAnimationFrame(()=>{viewer.scrollLeft=Math.max(0,contentX*ratio-localX);viewer.scrollTop=Math.max(0,contentY*ratio-localY)})
  }
  function resetZoom(){drawingZoom=1;desktopFitMode=isWideDesktop();zoomReset.textContent=desktopFitMode?'Fit ⛶':'100%';requestAdaptiveLayout({rebase:true});resetPosition()}
  function rotate(){rotation=(rotation+90)%360;rotateButton.textContent=`↻ ${rotation}°`;draw();requestAdaptiveLayout({rebase:true,hide:true});resetPosition()}
  zoomOut.onclick=()=>setZoom(Math.round((drawingZoom-.5)*2)/2);zoomIn.onclick=()=>setZoom(Math.round((drawingZoom+.5)*2)/2);zoomReset.onclick=resetZoom;document.getElementById('zoomResetCompact').onclick=resetZoom;viewReset.onclick=resetPosition;document.getElementById('viewResetCompact').onclick=resetPosition;rotateButton.onclick=rotate;document.getElementById('rotateCompact').onclick=rotate;

      lastPortrait=p;
      return;
    }

    if(p){
      placeOpenPortrait();
      const mp=minPanel(true),available=Math.max(1,card.clientHeight-fixedPortraitHeight()),maxViewer=Math.max(1,available-mp),fullW=Math.max(1,card.clientWidth);
      const base=Math.max(1,Math.min(fullW,maxViewer/ratio));
      const autoHeight=Math.min(maxViewer,base*ratio*z),manualMin=Math.min(maxViewer,window.innerWidth<=520?150:180);
      const height=mode==='manual'&&manualHeight!==null?Math.max(manualMin,Math.min(maxViewer,manualHeight)):autoHeight;
      card.style.setProperty('--pw-bottom-viewer',Math.round(height)+'px');
      splitter.dataset.mode=mode;splitter.setAttribute('aria-valuemin',String(Math.round(manualMin)));splitter.setAttribute('aria-valuemax',String(Math.round(maxViewer)));splitter.setAttribute('aria-valuenow',String(Math.round(height)));
      state.setFitBaseWidth(base);
      const key=`${mode}:portrait:${Math.round(base)}:${Math.round(height)}`;
      if(key!==lastSplitKey){lastSplitKey=key;window.dispatchEvent(new CustomEvent('weld:progress-split-changed',{detail:{mode,height}}))}
    }else{
      mode='auto';manualHeight=null;placeOpenLandscape();
      const mp=minPanel(false),cw=Math.max(1,card.clientWidth),maxViewer=Math.max(1,cw-mp),vh=Math.max(1,viewer.clientHeight);
      const base=Math.max(1,Math.min(maxViewer,vh/ratio)),viewerWidth=Math.min(maxViewer,base*z),panelWidth=Math.max(mp,cw-viewerWidth);
      card.style.setProperty('--pw-panel',Math.round(panelWidth)+'px');
      state.setFitBaseWidth(base);
      const key=`auto:landscape:${Math.round(base)}:${Math.round(viewerWidth)}:${Math.round(panelWidth)}`;
      if(key!==lastSplitKey){lastSplitKey=key;window.dispatchEvent(new CustomEvent('weld:progress-split-changed',{detail:{mode:'auto',width:viewerWidth}}))}
    }
    lastPortrait=p;
    document.body.classList.remove('progress-layout-pending');
  }

  function schedule({hide=false}={}){
    if(hide)document.body.classList.add('progress-layout-pending');
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(apply);
  }

  splitter.addEventListener('pointerdown',e=>{if(!portrait()||!open())return;e.preventDefault();e.stopPropagation();mode='manual';dragging=true;startY=e.clientY;startHeight=viewer.getBoundingClientRect().height;manualHeight=startHeight;try{splitter.setPointerCapture(e.pointerId)}catch(_){}})
  splitter.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();e.stopPropagation();manualHeight=startHeight+(e.clientY-startY);schedule()})
  const end=e=>{if(!dragging)return;e.preventDefault();e.stopPropagation();dragging=false;manualHeight=viewer.getBoundingClientRect().height;schedule();try{splitter.releasePointerCapture(e.pointerId)}catch(_){}};splitter.addEventListener('pointerup',end);splitter.addEventListener('pointercancel',end);
  splitter.addEventListener('keydown',e=>{if(!portrait()||!open()||!['ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();if(e.key==='Home'){mode='auto';manualHeight=null;schedule();return}mode='manual';manualHeight=viewer.getBoundingClientRect().height+(e.key==='ArrowDown'?24:-24);schedule()});

  window.addEventListener('weld:progress-layout-request',()=>schedule());
  window.addEventListener('weld:progress-list-open-changed',()=>schedule({hide:true}));
  window.addEventListener('weld:progress-page-changing',()=>document.body.classList.add('progress-layout-pending'));
  window.addEventListener('weld:progress-page-loaded',()=>schedule({hide:true}));
  window.addEventListener('weld:progress-zoom-changed',()=>{if(mode==='auto')schedule()});

  orientationMedia.addEventListener?.('change',()=>schedule({hide:true}));
  window.addEventListener('orientationchange',()=>schedule({hide:true}));
  window.addEventListener('resize',()=>{
    const p=portrait(),w=window.innerWidth;
    if(p!==lastPortrait||Math.abs(w-lastWidth)>4)schedule({hide:true});
    lastWidth=w;
  });

  document.body.classList.add('progress-layout-pending');
  schedule();
})();
</script>
<script>
(() => {
  const viewer=document.getElementById('viewer'),canvas=document.getElementById('canvas');
  const box=document.getElementById('progressMinimap'),mini=document.getElementById('progressMinimapCanvas'),viewport=document.getElementById('progressMinimapViewport');
  if(!viewer||!canvas||!box||!mini||!viewport)return;
  let queued=0;
  function refresh(){
    queued=0;
    if(!canvas.width||!canvas.height||canvas.hidden){box.classList.remove('show');return}
    const cr=canvas.getBoundingClientRect(),vw=viewer.clientWidth,vh=viewer.clientHeight;
    const zoomed=cr.width>vw+2||cr.height>vh+2||viewer.scrollWidth>vw+2||viewer.scrollHeight>vh+2;
    if(!zoomed){box.classList.remove('show');return}
    box.classList.add('show');
    const vr=viewer.getBoundingClientRect();
    const mw=Math.max(1,box.clientWidth),mh=Math.max(1,box.clientHeight),dpr=Math.min(2,window.devicePixelRatio||1);
    box.style.left=Math.round(vr.left+10)+'px';
    box.style.top=Math.round(Math.max(vr.top+10,vr.bottom-mh-10))+'px';
    mini.width=Math.round(mw*dpr);mini.height=Math.round(mh*dpr);
    const ctx=mini.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,mw,mh);
    const fit=Math.min(mw/canvas.width,mh/canvas.height),dw=canvas.width*fit,dh=canvas.height*fit,ox=(mw-dw)/2,oy=(mh-dh)/2;
    ctx.drawImage(canvas,ox,oy,dw,dh);
    const renderedW=Math.max(1,cr.width),renderedH=Math.max(1,cr.height);
    const visibleLeft=Math.max(0,viewer.scrollLeft),visibleTop=Math.max(0,viewer.scrollTop);
    const rx=ox+Math.min(dw,visibleLeft/renderedW*dw),ry=oy+Math.min(dh,visibleTop/renderedH*dh);
    const rw=Math.min(dw,vw/renderedW*dw),rh=Math.min(dh,vh/renderedH*dh);
    viewport.style.left=Math.max(ox,Math.min(ox+dw-rw,rx))+'px';
    viewport.style.top=Math.max(oy,Math.min(oy+dh-rh,ry))+'px';
    viewport.style.width=Math.max(8,rw)+'px';viewport.style.height=Math.max(8,rh)+'px';
  }
  function schedule(){if(queued)return;queued=requestAnimationFrame(refresh)}
  viewer.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule);
  window.addEventListener('weld:progress-split-changed',schedule);
  ['zoomOut','zoomReset','zoomIn','rotate','rotateCompact','viewReset','viewResetCompact','progressListToggle','progressListClose'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>setTimeout(schedule,30)));
  window.addEventListener('weld:progress-selection',()=>setTimeout(schedule,30));
  window.addEventListener('weld:progress-saved',()=>setTimeout(schedule,30));
  window.addEventListener('weld:progress-page-loaded',()=>setTimeout(schedule,60));
  new MutationObserver(schedule).observe(canvas,{attributes:true,attributeFilter:['width','height','style','hidden']});
  setTimeout(schedule,100);
})();
</script></body>
