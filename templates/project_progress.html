<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ project_name }} - 進捗入力</title>
  <style>
    *{box-sizing:border-box}:root{color-scheme:light;--blue:#1967d2;--green:#188038;--gray:#5f6368;--border:#dadce0;--bg:#f5f6f8;--text:#202124}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}
    main{max-width:1280px;margin:auto;padding:10px 10px 24px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}.title{margin:0;font-size:1.35rem}.meta{margin-top:2px;color:var(--gray);font-size:.84rem;overflow-wrap:anywhere}
    .button{min-height:42px;padding:0 11px;border:1px solid #bdc1c6;border-radius:9px;background:#fff;color:var(--text);cursor:pointer;font-weight:700}.card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .toolbar{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:5;white-space:nowrap}.page-field{display:flex;align-items:center;gap:4px;font-weight:700}.page-field input{width:54px;min-height:40px;padding:0 5px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;text-align:center}.page-total{font-size:.86rem;color:var(--gray);font-weight:700}.spacer{flex:1}.icon-button{min-width:42px;padding:0 8px;font-size:1.05rem}.zoom-value{min-width:58px}.desktop-tools{display:flex;gap:6px;align-items:center}
    .more{position:relative}.more summary{list-style:none;display:flex;align-items:center;justify-content:center;min-width:42px;height:42px;border:1px solid #bdc1c6;border-radius:9px;background:#fff;font-weight:800;cursor:pointer}.more summary::-webkit-details-marker{display:none}.more-menu{position:absolute;right:0;top:47px;z-index:20;width:180px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px #0003}.more-menu .button{display:block;width:100%;margin:3px 0;text-align:left}
    .statusline{padding:5px 9px;color:var(--gray);font-size:.8rem;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{display:flex;gap:5px;overflow-x:auto;padding:5px 7px;border-bottom:1px solid #eee;scrollbar-width:none}.summary::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:4px 8px;border-radius:999px;background:#f1f3f4;font-size:.78rem;font-weight:800;white-space:nowrap}.chip.working{background:#fef7e0;color:#8a4b00}.chip.done{background:#e6f4ea;color:#137333}
    .viewer{overflow:auto;max-height:calc(100vh - 160px);background:#e9eaed;overscroll-behavior:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100%;max-width:none;height:auto;margin:0 auto;background:#fff;touch-action:none;cursor:pointer}.empty{padding:36px 18px;text-align:center;color:var(--gray);line-height:1.7;white-space:pre-line}
    dialog{width:min(560px,calc(100vw - 24px));border:0;border-radius:18px;padding:0;box-shadow:0 18px 48px #0005;max-height:90vh}dialog::backdrop{background:#0007}.sheet{padding:18px;overflow:auto}.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:12px}.sheet h2{margin:0;font-size:1.2rem}.target{margin-top:3px;color:var(--gray)}.close{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:#fff;font-size:1.25rem;cursor:pointer}.label{display:block;font-weight:700;margin:14px 0 7px}.status-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status-button{min-height:54px;border:2px solid var(--border);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}.status-button[data-value="未着手"].active{border-color:#5f6368;background:#f1f3f4}.status-button[data-value="施工中"].active{border-color:#e37400;background:#fef7e0;color:#8a4b00}.status-button[data-value="完了"].active{border-color:#188038;background:#e6f4ea;color:#137333}input[type=date],textarea{width:100%;border:1px solid #bdc1c6;border-radius:10px;background:#fff;padding:11px 12px}input[type=date]{min-height:48px}textarea{min-height:100px;resize:vertical;line-height:1.5}.updated{min-height:1.4em;margin:10px 0 0;color:var(--gray);font-size:.82rem}.error{color:#b3261e}.actions{display:flex;gap:9px;margin-top:14px}.actions .button{flex:1}.save{border-color:var(--blue);background:var(--blue);color:#fff}button:disabled{opacity:.55;cursor:wait}
    body.progress-fullscreen{overflow:hidden;background:#000}body.progress-fullscreen main{max-width:none;height:100vh;height:100dvh;padding:0}body.progress-fullscreen .top{display:none}body.progress-fullscreen .card{height:100vh;height:100dvh;border:0;border-radius:0;display:flex;flex-direction:column}body.progress-fullscreen .toolbar{position:relative;top:auto;flex:0 0 auto}body.progress-fullscreen .statusline{display:none}body.progress-fullscreen .summary{flex:0 0 auto}body.progress-fullscreen .viewer{flex:1;min-height:0;max-height:none}
    @media(max-width:640px){
      main{padding:0}.top{display:none}.card{border:0;border-radius:0}.toolbar{height:48px;padding:3px 5px;gap:4px}.toolbar .button{min-height:40px}.page-field{gap:2px}.page-field>span:first-child{display:none}.page-field input{width:38px;min-height:40px;border:0;background:#f1f3f4;font-weight:800}.page-total{font-size:.78rem}.nav-button{min-width:38px;padding:0 6px;font-size:1.3rem}.desktop-tools{display:none}.compact-rotate,.compact-fullscreen{display:inline-flex;align-items:center;justify-content:center}.more{display:block}.statusline{display:none}.summary{height:31px;padding:3px 6px;gap:4px}.chip{padding:3px 7px;font-size:.73rem}.viewer{max-height:calc(100dvh - 79px);min-height:calc(100dvh - 79px)}
      dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}.sheet{padding:14px 14px 16px}.status-button{min-height:56px;padding:4px;font-size:.95rem}
      body.progress-fullscreen .toolbar{height:48px}body.progress-fullscreen .viewer{max-height:none;min-height:0}
    }
    @media(min-width:641px){.compact-rotate,.compact-fullscreen,.more{display:none}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1 class="title">進捗入力</h1><div class="meta">{{ project_name }} / {{ pdf_name }}</div></div><button class="button" id="back" type="button">← 工事一覧へ</button></div>
  <section class="card">
    <div class="toolbar">
      <button class="button nav-button" id="prev" type="button" aria-label="前のページ">‹</button>
      <label class="page-field"><span>ページ</span><input id="page" type="number" min="1" value="1" inputmode="numeric"><span class="page-total" id="pageTotal">/ -</span></label>
      <button class="button nav-button" id="next" type="button" aria-label="次のページ">›</button>
      <div class="spacer"></div>
      <div class="desktop-tools" aria-label="図面表示操作"><button class="button" id="zoomOut" type="button">−</button><button class="button zoom-value" id="zoomReset" type="button">100%</button><button class="button" id="zoomIn" type="button">＋</button><button class="button" id="rotate" type="button">↻ 0°</button><button class="button" id="viewReset" type="button">位置リセット</button><button class="button" id="reload" type="button">再読込</button><button class="button" id="fullscreen" type="button">⛶ 全画面</button></div>
      <button class="button icon-button compact-rotate" id="rotateCompact" type="button" aria-label="90度回転">↻</button>
      <button class="button icon-button compact-fullscreen" id="fullscreenCompact" type="button" aria-label="全画面">⛶</button>
      <details class="more" id="moreMenu"><summary aria-label="その他の操作">⋯</summary><div class="more-menu"><button class="button" id="zoomResetCompact" type="button">100%に戻す</button><button class="button" id="viewResetCompact" type="button">位置リセット</button><button class="button" id="reloadCompact" type="button">再読込</button><button class="button" id="backCompact" type="button">工事一覧へ</button></div></details>
    </div>
    <div class="statusline" id="status">図面を読み込んでいます…</div><div class="summary" id="summary" hidden></div>
    <div class="viewer" id="viewer"><canvas id="canvas"></canvas><div class="empty" id="empty" hidden></div></div>
  </section>
</main>
<dialog id="progressDialog"><form class="sheet" id="progressForm" method="dialog">
  <div class="sheet-head"><div><h2>施工情報</h2><div class="target" id="dialogTarget"></div></div><button class="close" id="closeDialog" type="button" aria-label="閉じる">×</button></div>
  <span class="label">状態</span><div class="status-buttons" id="statusButtons"><button type="button" class="status-button" data-value="未着手">未着手</button><button type="button" class="status-button" data-value="施工中">作業中</button><button type="button" class="status-button" data-value="完了">完了</button></div>
  <label class="label" for="completedDate">完了日</label><input id="completedDate" type="date"><label class="label" for="workDetail">メモ・作業内容</label><textarea id="workDetail" maxlength="1000" placeholder="施工内容、確認事項など"></textarea>
  <div class="updated" id="updated"></div><div class="actions"><button class="button" id="cancel" type="button">キャンセル</button><button class="button save" id="save" type="submit">保存</button></div>
</form></dialog>
<script>
(() => {
  const DISPLAY_LONG_EDGE=1600,SCALE=DISPLAY_LONG_EDGE/6000,HIT_CSS_PX=56;
  const projectId={{ project_id | tojson }};
  const progressUrl={{ url_for('progress.get_project_progress', project_id=project_id) | tojson }};
  const saveProgressUrl={{ url_for('progress.save_project_progress', project_id=project_id) | tojson }};
  const pdfiumInfoUrl={{ url_for('projects.pdfium_info', project_id=project_id) | tojson }};
  const pdfiumPageUrl={{ url_for('projects.pdfium_page', project_id=project_id) | tojson }};
  const projectsScreenUrl={{ url_for('projects_screen') | tojson }};
  const pageInput=document.getElementById('page'),pageTotal=document.getElementById('pageTotal'),prev=document.getElementById('prev'),next=document.getElementById('next'),reload=document.getElementById('reload');
  const zoomOut=document.getElementById('zoomOut'),zoomReset=document.getElementById('zoomReset'),zoomIn=document.getElementById('zoomIn'),rotateButton=document.getElementById('rotate'),viewReset=document.getElementById('viewReset'),fullscreenButton=document.getElementById('fullscreen');
  const status=document.getElementById('status'),summary=document.getElementById('summary'),viewer=document.getElementById('viewer'),canvas=document.getElementById('canvas'),empty=document.getElementById('empty');
  const dialog=document.getElementById('progressDialog'),form=document.getElementById('progressForm'),dialogTarget=document.getElementById('dialogTarget');
  const dateInput=document.getElementById('completedDate'),detailInput=document.getElementById('workDetail'),updated=document.getElementById('updated'),saveButton=document.getElementById('save'),source=document.createElement('canvas');
  let pageCount=0,candidates=[],progressMap=new Map(),active=null,busy=false,selectedStatus='未着手',drawingZoom=1,rotation=0,cssFullscreen=false;
  let touchMode='',touchMoved=false,touchStartX=0,touchStartY=0,touchStartScrollLeft=0,touchStartScrollTop=0,pinchStartDistance=0,pinchStartZoom=1,suppressClick=false;
  const goBack=()=>location.href=projectsScreenUrl;document.getElementById('back').onclick=goBack;document.getElementById('backCompact').onclick=goBack;document.getElementById('closeDialog').onclick=()=>dialog.close();document.getElementById('cancel').onclick=()=>dialog.close();
  function center(item){return{x:Math.round(item.bbox.x+item.bbox.w/2),y:Math.round(item.bbox.y+item.bbox.h/2)}}function keyFromXY(x,y){return `${Math.round(x)}:${Math.round(y)}`}function key(item){const c=center(item);return keyFromXY(c.x,c.y)}function toDisplayBox(b){return{x:b.x*SCALE,y:b.y*SCALE,w:b.w*SCALE,h:b.h*SCALE}}function statusLabel(v){return v==='施工中'?'作業中':v}
  function markerColor(v){if(v==='完了')return '#188038';if(v==='施工中')return '#e37400';return '#5f6368'}function markerFill(v){if(v==='完了')return 'rgba(24,128,56,.24)';if(v==='施工中')return 'rgba(227,116,0,.25)';return 'rgba(95,99,104,.20)'}
  function setBusy(v){busy=v;pageInput.disabled=v;prev.disabled=v||Number(pageInput.value)<=1;next.disabled=v||!pageCount||Number(pageInput.value)>=pageCount;reload.disabled=v;document.getElementById('reloadCompact').disabled=v}
  function setZoom(nextZoom,focalX=null,focalY=null){const next=Math.max(1,Math.min(4,nextZoom));if(Math.abs(next-drawingZoom)<.001)return;const rect=viewer.getBoundingClientRect(),localX=focalX===null?viewer.clientWidth/2:focalX-rect.left,localY=focalY===null?viewer.clientHeight/2:focalY-rect.top,contentX=viewer.scrollLeft+localX,contentY=viewer.scrollTop+localY,ratio=next/drawingZoom;drawingZoom=next;canvas.style.width=`${drawingZoom*100}%`;zoomReset.textContent=`${Math.round(drawingZoom*100)}%`;requestAnimationFrame(()=>{viewer.scrollLeft=Math.max(0,contentX*ratio-localX);viewer.scrollTop=Math.max(0,contentY*ratio-localY)})}
  function resetPosition(){viewer.scrollLeft=0;viewer.scrollTop=0}function resetZoom(){drawingZoom=1;canvas.style.width='100%';zoomReset.textContent='100%';resetPosition()}function rotate(){rotation=(rotation+90)%360;rotateButton.textContent=`↻ ${rotation}°`;draw();resetPosition()}
  zoomOut.onclick=()=>setZoom(Math.round((drawingZoom-.5)*2)/2);zoomIn.onclick=()=>setZoom(Math.round((drawingZoom+.5)*2)/2);zoomReset.onclick=resetZoom;document.getElementById('zoomResetCompact').onclick=resetZoom;viewReset.onclick=resetPosition;document.getElementById('viewResetCompact').onclick=resetPosition;rotateButton.onclick=rotate;document.getElementById('rotateCompact').onclick=rotate;
  function setFullscreenUi(on){document.body.classList.toggle('progress-fullscreen',on);fullscreenButton.textContent=on?'⛶ 全画面終了':'⛶ 全画面';document.getElementById('fullscreenCompact').textContent=on?'×':'⛶'}
  async function toggleFullscreen(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(_e){}return}if(cssFullscreen){cssFullscreen=false;setFullscreenUi(false);return}const target=document.documentElement;if(target.requestFullscreen){try{await target.requestFullscreen({navigationUI:'hide'});return}catch(_e){try{await target.requestFullscreen();return}catch(_e2){}}}cssFullscreen=true;setFullscreenUi(true)}fullscreenButton.onclick=toggleFullscreen;document.getElementById('fullscreenCompact').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;cssFullscreen=false;setFullscreenUi(on)});
  function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function beginSingleTouch(t){touchMode='pan';touchMoved=false;touchStartX=t.clientX;touchStartY=t.clientY;touchStartScrollLeft=viewer.scrollLeft;touchStartScrollTop=viewer.scrollTop}
  viewer.addEventListener('touchstart',e=>{if(e.touches.length===1){beginSingleTouch(e.touches[0]);return}if(e.touches.length===2){e.preventDefault();touchMode='pinch';touchMoved=true;suppressClick=true;pinchStartDistance=Math.max(1,touchDistance(e.touches[0],e.touches[1]));pinchStartZoom=drawingZoom}},{passive:false});
  viewer.addEventListener('touchmove',e=>{if(touchMode==='pinch'&&e.touches.length>=2){e.preventDefault();const a=e.touches[0],b=e.touches[1],distance=Math.max(1,touchDistance(a,b));setZoom(pinchStartZoom*distance/pinchStartDistance,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);suppressClick=true;return}if(touchMode==='pan'&&e.touches.length===1){const t=e.touches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.hypot(dx,dy)>6){touchMoved=true;suppressClick=true;e.preventDefault();viewer.scrollLeft=Math.max(0,touchStartScrollLeft-dx);viewer.scrollTop=Math.max(0,touchStartScrollTop-dy)}}},{passive:false});
  viewer.addEventListener('touchend',e=>{if(e.touches.length===1&&touchMode==='pinch'){e.preventDefault();beginSingleTouch(e.touches[0]);suppressClick=true;return}if(e.touches.length===0){const wasTap=touchMode==='pan'&&!touchMoved&&e.changedTouches.length===1,endedAfterGesture=suppressClick||touchMoved,touch=wasTap?e.changedTouches[0]:null;touchMode='';touchMoved=false;if(wasTap&&touch&&!busy&&candidates.length){e.preventDefault();suppressClick=true;const hit=findAt(eventPoint(touch));if(hit)openEditor(hit);setTimeout(()=>{suppressClick=false},350)}else if(endedAfterGesture){e.preventDefault();suppressClick=true;setTimeout(()=>{suppressClick=false},350)}else{suppressClick=false}}},{passive:false});viewer.addEventListener('touchcancel',()=>{touchMode='';touchMoved=false;suppressClick=false},{passive:true});
  function configureContext(){if(rotation===90||rotation===270){canvas.width=source.height;canvas.height=source.width}else{canvas.width=source.width;canvas.height=source.height}const ctx=canvas.getContext('2d');if(rotation===90){ctx.translate(canvas.width,0);ctx.rotate(Math.PI/2)}else if(rotation===180){ctx.translate(canvas.width,canvas.height);ctx.rotate(Math.PI)}else if(rotation===270){ctx.translate(0,canvas.height);ctx.rotate(-Math.PI/2)}return ctx}
  function eventPoint(e){const r=canvas.getBoundingClientRect(),rx=(e.clientX-r.left)*canvas.width/r.width,ry=(e.clientY-r.top)*canvas.height/r.height;let x=rx,y=ry;if(rotation===90){x=ry;y=source.height-rx}else if(rotation===180){x=source.width-rx;y=source.height-ry}else if(rotation===270){x=source.width-ry;y=rx}return{x:x/SCALE,y:y/SCALE}}
  function cssHitToOcr(px){const r=canvas.getBoundingClientRect();return px*Math.max(canvas.width/r.width,canvas.height/r.height)/SCALE}function findAt(p){const size=cssHitToOcr(HIT_CSS_PX),hits=candidates.filter(item=>{const b=item.bbox,ex=Math.max(0,(size-b.w)/2),ey=Math.max(0,(size-b.h)/2);return p.x>=b.x-ex&&p.x<=b.x+b.w+ex&&p.y>=b.y-ey&&p.y<=b.y+b.h+ey});if(!hits.length)return null;hits.sort((a,b)=>{const ac=center(a),bc=center(b);return((p.x-ac.x)**2+(p.y-ac.y)**2)-((p.x-bc.x)**2+(p.y-bc.y)**2)});return hits[0]}
  function draw(){const ctx=configureContext();ctx.drawImage(source,0,0);for(const item of candidates){const b=toDisplayBox(item.bbox),progress=progressMap.get(key(item)),value=progress?.status||'未着手',pad=Math.max(3,Math.max(b.w,b.h)*.32);ctx.save();ctx.fillStyle=markerFill(value);ctx.fillRect(b.x-pad,b.y-pad,b.w+pad*2,b.h+pad*2);ctx.strokeStyle=markerColor(value);ctx.lineWidth=Math.max(2,source.width/900);ctx.strokeRect(b.x-pad,b.y-pad,b.w+pad*2,b.h+pad*2);ctx.restore()}const all=candidates.length,working=candidates.filter(x=>progressMap.get(key(x))?.status==='施工中').length,done=candidates.filter(x=>progressMap.get(key(x))?.status==='完了').length,untouched=all-working-done;summary.hidden=false;summary.innerHTML=`<span class="chip">全 ${all}</span><span class="chip">未 ${untouched}</span><span class="chip working">作 ${working}</span><span class="chip done">完 ${done}</span>`}
  function blobToImage(blob){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(blob),img=new Image();img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('PDF画像を表示できませんでした。'))};img.src=u})}async function renderPage(n){const r=await fetch(`${pdfiumPageUrl}?page=${n}&longEdge=${DISPLAY_LONG_EDGE}&format=png`);if(!r.ok)throw new Error((await r.text())||'PDF画像を取得できませんでした。');const img=await blobToImage(await r.blob());source.width=img.naturalWidth;source.height=img.naturalHeight;source.getContext('2d').drawImage(img,0,0)}
  async function loadPage(n){if(busy||!pageCount)return;n=Math.max(1,Math.min(pageCount,Number(n)||1));pageInput.value=n;setBusy(true);drawingZoom=1;rotation=0;zoomReset.textContent='100%';rotateButton.textContent='↻ 0°';canvas.style.width='100%';resetPosition();status.className='statusline';status.textContent=`${n} / ${pageCount} ページを読み込み中…`;empty.hidden=true;canvas.hidden=false;try{const [data]=await Promise.all([fetch(`${progressUrl}?page=${n}`).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'進捗データを取得できませんでした。');return d}),renderPage(n)]);candidates=data.candidates||[];progressMap=new Map((data.items||[]).map(x=>[keyFromXY(x.x,x.y),x]));if(!data.saved||!candidates.length){canvas.hidden=true;empty.hidden=false;empty.textContent='このページは番号配置がまだ確定保存されていません。\n先に図面エントリーで番号配置を保存してください。';summary.hidden=true;status.textContent=`${n} / ${pageCount} ページ：進捗入力対象なし`}else{draw();status.textContent=`${n} / ${pageCount} ページ。ピンチ・移動・回転・全画面が使えます。`}}catch(e){status.className='statusline error';status.textContent=e.message}finally{setBusy(false)}}
  function selectStatus(v){selectedStatus=v;document.querySelectorAll('.status-button').forEach(b=>b.classList.toggle('active',b.dataset.value===v));if(v==='完了'&&!dateInput.value)dateInput.value=new Date().toISOString().slice(0,10)}function openEditor(item){active=item;const saved=progressMap.get(key(item));dialogTarget.textContent=`対象番号：${item.number}　（ページ ${pageInput.value}）`;detailInput.value=saved?.workDetail||'';dateInput.value=saved?.completedDate||'';updated.textContent=saved?.updatedAt?`最終更新：${new Date(saved.updatedAt).toLocaleString('ja-JP')}`:'まだ保存されていません';updated.className='updated';selectStatus(saved?.status||'未着手');dialog.showModal()}
  document.getElementById('statusButtons').onclick=e=>{const b=e.target.closest('[data-value]');if(b)selectStatus(b.dataset.value)};canvas.addEventListener('click',e=>{if(busy||!candidates.length||suppressClick)return;const hit=findAt(eventPoint(e));if(hit)openEditor(hit)});
  form.addEventListener('submit',async e=>{e.preventDefault();if(!active||busy)return;const c=center(active);saveButton.disabled=true;saveButton.textContent='保存中…';updated.className='updated';updated.textContent='保存しています…';try{const r=await fetch(saveProgressUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageNumber:Number(pageInput.value),number:active.number,x:c.x,y:c.y,status:selectedStatus,completedDate:dateInput.value,workDetail:detailInput.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'保存に失敗しました。');progressMap.set(key(active),data);draw();dialog.close();status.textContent=`${active.number} を「${statusLabel(data.status)}」で保存しました。`}catch(err){updated.className='updated error';updated.textContent=err.message}finally{saveButton.disabled=false;saveButton.textContent='保存'}});
  prev.onclick=()=>loadPage(Number(pageInput.value)-1);next.onclick=()=>loadPage(Number(pageInput.value)+1);reload.onclick=()=>loadPage(Number(pageInput.value));document.getElementById('reloadCompact').onclick=()=>{document.getElementById('moreMenu').open=false;loadPage(Number(pageInput.value))};pageInput.onchange=()=>loadPage(Number(pageInput.value));
  (async()=>{setBusy(true);try{const r=await fetch(pdfiumInfoUrl),data=await r.json();if(!r.ok)throw new Error(data.error||'PDF情報を取得できませんでした。');pageCount=data.pageCount;pageTotal.textContent=`/ ${pageCount}`;setBusy(false);await loadPage(1)}catch(e){status.className='statusline error';status.textContent=e.message;setBusy(false)}})();
})();
</script>
<script>
(() => {
  const projectId={{ project_id | tojson }};
  const rotationKey=`weldDrawingRotation:${projectId}`;
  const rotateButton=document.getElementById('rotate');
  const rotateCompact=document.getElementById('rotateCompact');
  const canvas=document.getElementById('canvas');
  const normalizeThumbs=()=>{
    document.querySelectorAll('#progressThumbs img[data-src]').forEach(img=>{
      const fixed=img.dataset.src.replace(/longEdge=(?:320|360)/,'longEdge=500');
      if(fixed!==img.dataset.src){img.dataset.src=fixed;if(img.getAttribute('src'))img.src=fixed;}
      img.loading='lazy';img.decoding='async';
    });
  };
  const thumbObserver=new MutationObserver(normalizeThumbs);
  thumbObserver.observe(document.documentElement,{subtree:true,childList:true});
  normalizeThumbs();
  const saveRotation=()=>{const match=rotateButton?.textContent?.match(/(0|90|180|270)/);if(match){try{localStorage.setItem(rotationKey,match[1]);}catch(_e){}}};
  [rotateButton,rotateCompact].filter(Boolean).forEach(button=>button.addEventListener('click',saveRotation));
  let stored=0;try{stored=Number(localStorage.getItem(rotationKey)||0);}catch(_e){}
  if(![0,90,180,270].includes(stored)||stored===0)return;
  const apply=()=>{if(!canvas||canvas.width<=0||!rotateButton||rotateButton.disabled)return false;for(let i=0;i<stored/90;i++)rotateButton.click();return true;};
  if(apply())return;
  const readyObserver=new MutationObserver(()=>{if(apply())readyObserver.disconnect();});
  if(canvas)readyObserver.observe(canvas,{attributes:true,attributeFilter:['width','height']});
  if(rotateButton)readyObserver.observe(rotateButton,{attributes:true,attributeFilter:['disabled']});
})();
</script>
<script>
(() => {
  const pageInput=document.getElementById('page');
  const pageTotal=document.getElementById('pageTotal');
  document.addEventListener('click',e=>{
    const thumb=e.target.closest?.('.progress-thumb');
    if(thumb&&Number(thumb.dataset.page)===Number(pageInput.value)){
      e.preventDefault();e.stopImmediatePropagation();return;
    }
    const total=Number((pageTotal.textContent||'').replace(/\D/g,''))||0;
    if(e.target.closest?.('#prev')&&Number(pageInput.value)<=1){e.preventDefault();e.stopImmediatePropagation();return;}
    if(e.target.closest?.('#next')&&total&&Number(pageInput.value)>=total){e.preventDefault();e.stopImmediatePropagation();}
  },true);
})();
</script>
