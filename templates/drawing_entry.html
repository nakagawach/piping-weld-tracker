<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理 - 図面エントリー</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124}main{max-width:1200px;margin:auto;padding:20px 16px 40px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.back{min-height:42px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;padding:0 14px;font:inherit;cursor:pointer}.card{background:#fff;border:1px solid #dadce0;border-radius:14px;padding:18px}.title{margin:0;font-size:clamp(1.35rem,4vw,1.8rem)}.meta{margin:6px 0 0;color:#5f6368;overflow-wrap:anywhere}.stage{margin-top:16px;border:1px solid #dadce0;border-radius:10px;overflow:hidden;background:#eee}.pdf-frame{display:block;width:100%;height:760px;border:0;background:#fff}.note{margin:14px 0 0;color:#5f6368;line-height:1.6}.error{color:#b3261e;padding:16px}.loading{padding:20px;color:#5f6368}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.pdf-frame{height:620px}.back{width:100%}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1 class="title">図面エントリー</h1><p class="meta" id="project-meta">工事情報を読み込んでいます…</p></div><button class="back" id="back" type="button">← 工事一覧へ</button></div>
  <section class="card">
    <div id="content" class="loading">登録PDFを読み込んでいます…</div>
  </section>
</main>
<script>
const params=new URLSearchParams(location.search);const projectId=params.get('projectId');const meta=document.getElementById('project-meta');const content=document.getElementById('content');
document.getElementById('back').onclick=()=>location.href='projects-screen';
function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
async function load(){if(!projectId){meta.textContent='工事が指定されていません。';content.className='error';content.textContent='工事一覧から工事を選択してください。';return}try{const r=await fetch(`projects/${encodeURIComponent(projectId)}`);const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'工事情報を取得できませんでした。');meta.textContent=`${p.projectName} / ${p.pdfName}`;content.className='';content.innerHTML=`<div class="stage"><iframe class="pdf-frame" src="${esc(p.pdfUrl)}" title="${esc(p.pdfName)}"></iframe></div><p class="note">今回は②図面エントリー画面への導線と、登録したPDFが正しく表示されることだけを確認します。OCR・番号補正・保存処理はまだこの画面へ接続していません。</p>`}catch(e){content.className='error';content.textContent=e.message}}
load();
</script>
</body>
</html>
