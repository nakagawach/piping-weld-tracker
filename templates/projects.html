<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理 - 工事一覧</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124} main{max-width:920px;margin:auto;padding:24px 16px 48px}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}.header-actions{display:flex;gap:10px;align-items:center}h1{margin:0;font-size:clamp(1.45rem,4vw,2rem)}.sub,.muted{color:#5f6368}.primary,.button{min-height:44px;border-radius:9px;padding:0 16px;font:inherit;cursor:pointer}.primary{border:0;background:#1967d2;color:#fff;font-weight:700}.button{border:1px solid #bdc1c6;background:#fff}.dashboard-button{border-color:#1967d2;color:#1967d2;font-weight:800}.danger{border-color:#d93025;color:#b3261e}.card{background:#fff;border:1px solid #dadce0;border-radius:14px;padding:18px;margin-bottom:14px}.project-head{display:flex;gap:12px;justify-content:space-between}.project-title{margin:0;font-size:1.15rem}.pdf-name{margin:6px 0;color:#5f6368;overflow-wrap:anywhere}.project-progress{margin:12px 0 16px;padding:11px 12px;border:1px solid #e0e3e7;border-radius:11px;background:#f8fafd}.project-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.project-progress-rate{font-size:1.05rem;font-weight:900}.project-status{display:inline-flex;align-items:center;min-height:26px;padding:2px 9px;border-radius:999px;background:#e8eaed;color:#3c4043;font-size:.76rem;font-weight:800}.project-status.working{background:#fef7e0;color:#8a4f00}.project-status.done{background:#e6f4ea;color:#137333}.project-status.unentered{border:1px dashed #9aa0a6;background:#fff;color:#5f6368}.project-progress-bar{height:8px;margin-top:9px;border-radius:99px;background:#e8eaed;overflow:hidden}.project-progress-bar>span{display:block;height:100%;background:#188038}.project-progress-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;color:#5f6368;font-size:.78rem}.project-progress-error{color:#b3261e;font-size:.82rem}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.open{border-color:#1967d2;color:#1967d2;font-weight:700}.progress{border-color:#188038;background:#188038;color:#fff;font-weight:800}dialog{width:min(520px,calc(100vw - 32px));border:0;border-radius:14px;padding:0;box-shadow:0 12px 36px #0004}dialog::backdrop{background:#0006}.dialog-body{padding:20px}.dialog-body h2{margin-top:0}label{display:grid;gap:6px;margin-bottom:14px;font-weight:600}input{width:100%;min-height:44px;padding:9px 10px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.error{color:#b3261e;min-height:1.5em}.empty{text-align:center;padding:28px}@media(max-width:640px){.header{align-items:stretch;flex-direction:column}.header-actions{display:grid;grid-template-columns:1fr 1fr}.header-actions .primary,.header-actions .button{width:100%;padding:0 10px}.project-head{flex-direction:column}.actions{justify-content:stretch}.actions .button{flex:1}.actions .progress{flex-basis:100%}}
  </style>
</head>
<body>
<main>
  <div class="header"><div><h1>溶接進捗管理</h1><div class="sub">工事一覧</div></div><div class="header-actions"><button class="button dashboard-button" id="progress-dashboard" type="button">全体進捗</button><button class="primary" id="new-project">＋ 新しい工事を登録</button></div></div>
  <div id="project-list"><div class="card empty muted">工事一覧を読み込んでいます…</div></div>
</main>
<dialog id="dialog"><form class="dialog-body" id="form"><h2>新しい工事を登録</h2><label>工事名<input id="project-name" name="projectName" type="text" maxlength="200" required placeholder="例：○○工場 配管更新工事"></label><label>図面PDF<input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required></label><div class="error" id="error"></div><div class="dialog-actions"><button class="button" id="cancel" type="button">キャンセル</button><button class="primary" id="register" type="submit">登録</button></div></form></dialog>
<script>
const list=document.getElementById('project-list'),dialog=document.getElementById('dialog'),form=document.getElementById('form'),errorBox=document.getElementById('error'),register=document.getElementById('register');
function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
function statusClass(status){if(status==='完了')return'done';if(status==='施工中')return'working';if(status==='未エントリー')return'unentered';return''}
function renderProgressSummary(projectId,item){const box=document.querySelector(`[data-progress-summary="${projectId}"]`);if(!box)return;const total=Number(item.total)||0,done=Number(item.done)||0,working=Number(item.working)||0,untouched=Number(item.untouched)||0,rate=Math.max(0,Math.min(100,Number(item.completionRate)||0)),status=item.status||'未エントリー';box.innerHTML=`<div class="project-progress-head"><span class="project-status ${statusClass(status)}">${esc(status)}</span><span class="project-progress-rate">${rate.toFixed(1)}%</span></div><div class="project-progress-bar" aria-label="完了率 ${rate.toFixed(1)}%"><span style="width:${rate}%"></span></div><div class="project-progress-meta"><span>完了 ${done} / ${total}</span><span>施工中 ${working}</span><span>未着手 ${untouched}</span></div>`}
async function loadProgressSummaries(){try{const r=await fetch('progress-dashboard-data',{cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'進捗を取得できませんでした。');const byId=new Map((data.projects||[]).map(item=>[Number(item.id),item]));document.querySelectorAll('[data-progress-summary]').forEach(box=>{const item=byId.get(Number(box.dataset.progressSummary));if(item)renderProgressSummary(item.id,item);else box.innerHTML='<div class="muted">進捗データなし</div>'})}catch(e){document.querySelectorAll('[data-progress-summary]').forEach(box=>box.innerHTML=`<div class="project-progress-error">${esc(e.message)}</div>`)}}
async function load(){try{const r=await fetch('projects');if(!r.ok)throw new Error('工事一覧を取得できませんでした。');const data=await r.json();if(!data.projects.length){list.innerHTML='<div class="card empty muted">登録された工事はまだありません。</div>';return}list.innerHTML=data.projects.map(p=>`<section class="card"><div class="project-head"><div><h2 class="project-title">${esc(p.projectName)}</h2><p class="pdf-name">${esc(p.pdfName)}</p></div></div><div class="project-progress" data-progress-summary="${p.id}"><div class="muted">進捗を読み込んでいます…</div></div><div class="actions"><button class="button progress" data-progress="projects/${p.id}/progress">進捗入力</button><button class="button open" data-entry="${esc(p.entryUrl)}">図面エントリー</button><button class="button" data-pdf="${esc(p.pdfUrl)}">PDFを開く</button><button class="button danger" data-delete="${p.id}" data-name="${esc(p.projectName)}">削除</button></div></section>`).join('');loadProgressSummaries()}catch(e){list.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
document.getElementById('progress-dashboard').onclick=()=>{location.href='progress-dashboard'};
document.getElementById('new-project').onclick=()=>{errorBox.textContent='';form.reset();dialog.showModal()};document.getElementById('cancel').onclick=()=>dialog.close();
list.addEventListener('click',async e=>{const progressButton=e.target.closest('[data-progress]');if(progressButton){location.href=progressButton.dataset.progress;return}const entryButton=e.target.closest('[data-entry]');if(entryButton){location.href=entryButton.dataset.entry;return}const openButton=e.target.closest('[data-pdf]');if(openButton){window.open(openButton.dataset.pdf,'_blank','noopener');return}const deleteButton=e.target.closest('[data-delete]');if(!deleteButton)return;const projectId=deleteButton.dataset.delete;const projectName=deleteButton.dataset.name;if(!confirm(`「${projectName}」を削除しますか？\n登録したPDFも削除されます。`))return;deleteButton.disabled=true;deleteButton.textContent='削除中…';try{const r=await fetch(`projects/${projectId}`,{method:'DELETE'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'削除に失敗しました。');await load()}catch(err){alert(err.message);deleteButton.disabled=false;deleteButton.textContent='削除'}});
form.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';const file=document.getElementById('pdf').files[0];if(!file||!file.name.toLowerCase().endsWith('.pdf')){errorBox.textContent='PDFファイルを選択してください。';return}register.disabled=true;register.textContent='登録中…';try{const r=await fetch('projects',{method:'POST',body:new FormData(form)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'登録に失敗しました。');dialog.close();await load()}catch(err){errorBox.textContent=err.message}finally{register.disabled=false;register.textContent='登録'}});load();
</script>
</body></html>
