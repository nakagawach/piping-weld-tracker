<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理 - 工事一覧</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124} main{max-width:920px;margin:auto;padding:24px 16px 48px}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}h1{margin:0;font-size:clamp(1.45rem,4vw,2rem)}.sub,.muted{color:#5f6368}.primary,.button{min-height:44px;border-radius:9px;padding:0 16px;font:inherit;cursor:pointer}.primary{border:0;background:#1967d2;color:#fff;font-weight:700}.button{border:1px solid #bdc1c6;background:#fff}.danger{border-color:#d93025;color:#b3261e}.card{background:#fff;border:1px solid #dadce0;border-radius:14px;padding:18px;margin-bottom:14px}.project-head{display:flex;gap:12px;justify-content:space-between}.project-title{margin:0;font-size:1.15rem}.pdf-name{margin:6px 0;color:#5f6368;overflow-wrap:anywhere}.progress-summary{margin:14px 0 16px;padding:13px 14px;border:1px solid #e0e3e7;border-radius:12px;background:#f8fafd}.progress-summary-head{display:flex;align-items:end;justify-content:space-between;gap:12px}.progress-rate{font-size:1.45rem;font-weight:900;line-height:1;color:#174ea6}.progress-label{margin-top:4px;color:#5f6368;font-size:.78rem}.progress-counts{font-size:.84rem;color:#3c4043;text-align:right}.progress-bar{height:9px;margin-top:10px;border-radius:99px;background:#e8eaed;overflow:hidden}.progress-bar>span{display:block;height:100%;width:0;border-radius:inherit;background:#188038}.progress-breakdown{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.78rem;color:#5f6368}.progress-error{color:#b3261e;font-size:.82rem}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.open{border-color:#1967d2;color:#1967d2;font-weight:700}.progress{border-color:#188038;background:#188038;color:#fff;font-weight:800}dialog{width:min(520px,calc(100vw - 32px));border:0;border-radius:14px;padding:0;box-shadow:0 12px 36px #0004}dialog::backdrop{background:#0006}.dialog-body{padding:20px}.dialog-body h2{margin-top:0}label{display:grid;gap:6px;margin-bottom:14px;font-weight:600}input{width:100%;min-height:44px;padding:9px 10px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.error{color:#b3261e;min-height:1.5em}.empty{text-align:center;padding:28px}@media(max-width:640px){.header{align-items:stretch;flex-direction:column}.primary{width:100%}.project-head{flex-direction:column}.progress-summary-head{align-items:flex-start}.progress-counts{text-align:left}.actions{justify-content:stretch}.actions .button{flex:1}.actions .progress{flex-basis:100%}}
  </style>
</head>
<body>
<main>
  <div class="header"><div><h1>溶接進捗管理</h1><div class="sub">工事一覧</div></div><button class="primary" id="new-project">＋ 新しい工事を登録</button></div>
  <div id="project-list"><div class="card empty muted">工事一覧を読み込んでいます…</div></div>
</main>
<dialog id="dialog"><form class="dialog-body" id="form"><h2>新しい工事を登録</h2><label>工事名<input id="project-name" name="projectName" type="text" maxlength="200" required placeholder="例：○○工場 配管更新工事"></label><label>図面PDF<input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required></label><div class="error" id="error"></div><div class="dialog-actions"><button class="button" id="cancel" type="button">キャンセル</button><button class="primary" id="register" type="submit">登録</button></div></form></dialog>
<script>
const list=document.getElementById('project-list'),dialog=document.getElementById('dialog'),form=document.getElementById('form'),errorBox=document.getElementById('error'),register=document.getElementById('register');
function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
function renderProgressSummary(projectId,data){
  const box=document.querySelector(`[data-progress-summary="${projectId}"]`);
  if(!box)return;
  const counts=data.counts||{total:0,untouched:0,working:0,done:0};
  const rate=Number(data.completionRate)||0;
  box.innerHTML=`<div class="progress-summary-head"><div><div class="progress-rate">${rate.toFixed(1)}%</div><div class="progress-label">全体進捗</div></div><div class="progress-counts">完了 <strong>${counts.done}</strong> / ${counts.total}件</div></div><div class="progress-bar" aria-hidden="true"><span style="width:${Math.max(0,Math.min(100,rate))}%"></span></div><div class="progress-breakdown"><span>未着手 ${counts.untouched}件</span><span>施工中 ${counts.working}件</span><span>完了 ${counts.done}件</span></div>`;
}
async function loadProgressSummaries(projects){
  await Promise.all(projects.map(async project=>{
    const box=document.querySelector(`[data-progress-summary="${project.id}"]`);
    try{
      const response=await fetch(`projects/${project.id}/progress-list-data`,{cache:'no-store'});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||'進捗を取得できませんでした。');
      renderProgressSummary(project.id,data);
    }catch(error){
      if(box)box.innerHTML=`<div class="progress-error">${esc(error.message)}</div>`;
    }
  }));
}
async function load(){try{const r=await fetch('projects');if(!r.ok)throw new Error('工事一覧を取得できませんでした。');const data=await r.json();if(!data.projects.length){list.innerHTML='<div class="card empty muted">登録された工事はまだありません。</div>';return}list.innerHTML=data.projects.map(p=>`<section class="card"><div class="project-head"><div><h2 class="project-title">${esc(p.projectName)}</h2><p class="pdf-name">${esc(p.pdfName)}</p></div></div><div class="progress-summary" data-progress-summary="${p.id}"><div class="muted">進捗を読み込んでいます…</div></div><div class="actions"><button class="button progress" data-progress="projects/${p.id}/progress">進捗入力</button><button class="button open" data-entry="${esc(p.entryUrl)}">図面エントリー</button><button class="button" data-pdf="${esc(p.pdfUrl)}">PDFを開く</button><button class="button danger" data-delete="${p.id}" data-name="${esc(p.projectName)}">削除</button></div></section>`).join('');loadProgressSummaries(data.projects)}catch(e){list.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
document.getElementById('new-project').onclick=()=>{errorBox.textContent='';form.reset();dialog.showModal()};document.getElementById('cancel').onclick=()=>dialog.close();
list.addEventListener('click',async e=>{const progressButton=e.target.closest('[data-progress]');if(progressButton){location.href=progressButton.dataset.progress;return}const entryButton=e.target.closest('[data-entry]');if(entryButton){location.href=entryButton.dataset.entry;return}const openButton=e.target.closest('[data-pdf]');if(openButton){window.open(openButton.dataset.pdf,'_blank','noopener');return}const deleteButton=e.target.closest('[data-delete]');if(!deleteButton)return;const projectId=deleteButton.dataset.delete;const projectName=deleteButton.dataset.name;if(!confirm(`「${projectName}」を削除しますか？\n登録したPDFも削除されます。`))return;deleteButton.disabled=true;deleteButton.textContent='削除中…';try{const r=await fetch(`projects/${projectId}`,{method:'DELETE'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'削除に失敗しました。');await load()}catch(err){alert(err.message);deleteButton.disabled=false;deleteButton.textContent='削除'}});
form.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';const file=document.getElementById('pdf').files[0];if(!file||!file.name.toLowerCase().endsWith('.pdf')){errorBox.textContent='PDFファイルを選択してください。';return}register.disabled=true;register.textContent='登録中…';try{const r=await fetch('projects',{method:'POST',body:new FormData(form)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'登録に失敗しました。');dialog.close();await load()}catch(err){errorBox.textContent=err.message}finally{register.disabled=false;register.textContent='登録'}});load();
</script>
</body></html>
