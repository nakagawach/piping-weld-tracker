<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理 - 工事一覧</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124} main{max-width:920px;margin:auto;padding:24px 16px 48px}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}h1{margin:0;font-size:clamp(1.45rem,4vw,2rem)}.sub,.muted{color:#5f6368}.primary,.button{min-height:44px;border-radius:9px;padding:0 16px;font:inherit;cursor:pointer}.primary{border:0;background:#1967d2;color:#fff;font-weight:700}.button{border:1px solid #bdc1c6;background:#fff}.card{background:#fff;border:1px solid #dadce0;border-radius:14px;padding:18px;margin-bottom:14px}.project-head{display:flex;gap:12px;justify-content:space-between}.project-title{margin:0;font-size:1.15rem}.pdf-name{margin:6px 0;color:#5f6368;overflow-wrap:anywhere}.actions{display:flex;gap:10px;justify-content:flex-end}.open{border-color:#1967d2;color:#1967d2;font-weight:700}dialog{width:min(520px,calc(100vw - 32px));border:0;border-radius:14px;padding:0;box-shadow:0 12px 36px #0004}dialog::backdrop{background:#0006}.dialog-body{padding:20px}.dialog-body h2{margin-top:0}label{display:grid;gap:6px;margin-bottom:14px;font-weight:600}input{width:100%;min-height:44px;padding:9px 10px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.error{color:#b3261e;min-height:1.5em}.empty{text-align:center;padding:28px}.sample{border-style:dashed}@media(max-width:640px){.header{align-items:stretch;flex-direction:column}.primary{width:100%}.project-head{flex-direction:column}.actions{justify-content:stretch}.actions .button{flex:1}}
  </style>
</head>
<body>
<main>
  <div class="header"><div><h1>溶接進捗管理</h1><div class="sub">工事一覧</div></div><button class="primary" id="new-project">＋ 新しい工事を登録</button></div>
  <div id="project-list"><div class="card empty muted">工事一覧を読み込んでいます…</div></div>
  <section class="card sample"><div class="project-head"><div><h2 class="project-title">サンプル工事（既存テストデータ）</h2><p class="pdf-name">sample.pdf</p></div></div><div class="actions"><button class="button open" id="open-current">従来画面を開く</button></div></section>
</main>
<dialog id="dialog"><form class="dialog-body" id="form"><h2>新しい工事を登録</h2><label>工事名<input id="project-name" name="projectName" type="text" maxlength="200" required placeholder="例：○○工場 配管更新工事"></label><label>図面PDF<input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required></label><div class="error" id="error"></div><div class="dialog-actions"><button class="button" id="cancel" type="button">キャンセル</button><button class="primary" id="register" type="submit">登録</button></div></form></dialog>
<script>
const list=document.getElementById('project-list'),dialog=document.getElementById('dialog'),form=document.getElementById('form'),errorBox=document.getElementById('error'),register=document.getElementById('register');
function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
async function load(){try{const r=await fetch('projects');if(!r.ok)throw new Error('工事一覧を取得できませんでした。');const data=await r.json();if(!data.projects.length){list.innerHTML='<div class="card empty muted">登録された工事はまだありません。</div>';return}list.innerHTML=data.projects.map(p=>`<section class="card"><div class="project-head"><div><h2 class="project-title">${esc(p.projectName)}</h2><p class="pdf-name">${esc(p.pdfName)}</p></div></div><div class="actions"><button class="button open" data-project="${p.id}">図面エントリーを開く</button><button class="button" data-pdf="${esc(p.pdfUrl)}">PDFのみ開く</button></div></section>`).join('');}catch(e){list.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
document.getElementById('new-project').onclick=()=>{errorBox.textContent='';form.reset();dialog.showModal()};document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('open-current').onclick=()=>location.href='./';
list.addEventListener('click',e=>{const entry=e.target.closest('[data-project]');if(entry){location.href=`drawing-entry-screen?projectId=${encodeURIComponent(entry.dataset.project)}`;return}const pdf=e.target.closest('[data-pdf]');if(pdf)window.open(pdf.dataset.pdf,'_blank','noopener')});
form.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';const file=document.getElementById('pdf').files[0];if(!file||!file.name.toLowerCase().endsWith('.pdf')){errorBox.textContent='PDFファイルを選択してください。';return}register.disabled=true;register.textContent='登録中…';try{const r=await fetch('projects',{method:'POST',body:new FormData(form)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'登録に失敗しました。');dialog.close();await load()}catch(err){errorBox.textContent=err.message}finally{register.disabled=false;register.textContent='登録'}});load();
</script>
</body></html>
