<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #202124;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
    }
    h1 { margin: 0 0 8px; }
    p { line-height: 1.7; }
    .pdf-frame {
      width: 100%;
      height: 760px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #eee;
    }
    .fallback { margin-top: 12px; }
    .fallback a { color: #0b57d0; }
    @media (max-width: 700px) {
      .pdf-frame { height: 560px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>溶接進捗管理</h1>
      <p>PythonAnywhere内に保存したPDFを表示しています。</p>
      <iframe
        class="pdf-frame"
        src="{{ url_for('static', filename='sample.pdf') }}"
        title="配管図サンプルPDF"
      ></iframe>
      <p class="fallback">
        PDFが枠内に表示されない場合は
        <a href="{{ url_for('static', filename='sample.pdf') }}" target="_blank" rel="noopener noreferrer">新しいタブでPDFを開く</a>
        を使ってください。
      </p>
    </section>
  </main>
</body>
</html>
