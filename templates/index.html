<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>溶接進捗管理</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6f8; color: #202124; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
    h1 { margin: 0 0 8px; } h2 { margin: 26px 0 8px; font-size: 1.2rem; } p { line-height: 1.7; }
    .pdf-frame { width: 100%; height: 760px; border: 1px solid #ccc; border-radius: 8px; background: #eee; }
    .fallback { margin-top: 12px; } .fallback a { color: #0b57d0; }
    .detect-panel { margin-top: 22px; padding-top: 4px; border-top: 1px solid #e0e0e0; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: grid; gap: 6px; }
    input[type="number"] { width: 90px; min-height: 40px; padding: 0 10px; border: 1px solid #b7b7b7; border-radius: 8px; font: inherit; }
    button { min-height: 44px; padding: 0 18px; border: 1px solid #b7b7b7; border-radius: 8px; background: #fff; color: #202124; font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.6; }
    #ocr-status { min-height: 1.5em; margin: 12px 0; }
    .preview-wrap { margin-top: 12px; overflow: auto; max-height: 720px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
    #preview-canvas { display: block; max-width: 100%; height: auto; }
    .result-wrap { overflow-x: auto; margin-top: 12px; max-height: 420px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 7px 9px; border-bottom: 1px solid #e2e2e2; text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; background: #f7f7f7; }
    .note { color: #5f6368; font-size: 0.9rem; }
    @media (max-width: 700px) { .pdf-frame { height: 560px; } }
  </style>
</head>
<body>
<main><section class="card">
  <h1>溶接進捗管理</h1>
  <p>PythonAnywhere内に保存したPDFを表示しています。</p>
  <iframe class="pdf-frame" src="{{ url_for('static', filename='sample.pdf') }}" title="配管図サンプルPDF"></iframe>
  <p class="fallback">PDFが枠内に表示されない場合は <a href="{{ url_for('static', filename='sample.pdf') }}" target="_blank" rel="noopener noreferrer">新しいタブでPDFを開く</a> を使ってください。</p>
  <section class="detect-panel" aria-labelledby="ocr-title">
    <h2 id="ocr-title">丸囲み番号候補の抽出テスト</h2>
    <p>4分割Google Vision OCRの結果から、単独の1〜99だけを番号候補として抽出します。今回は円形判定はまだ行わず、候補抽出だけを確認します。</p>
    <div class="controls">
      <label>対象ページ<input id="page-number" type="number" min="1" value="1" inputmode="numeric"></label>
      <button id="ocr-button" type="button">番号候補を抽出</button>
    </div>
    <p id="ocr-status" aria-live="polite">未実行</p>
    <div class="preview-wrap" id="preview-wrap" hidden><canvas id="preview-canvas"></canvas></div>
    <div class="result-wrap"><table id="ocr-table" hidden><thead><tr><th>番号候補</th><th>X</th><th>Y</th><th>幅</th><th>高さ</th></tr></thead><tbody id="ocr-body"></tbody></table></div>
    <p class="note">青枠が1〜99の番号候補です。DB保存・既存PDF表示・Google Vision API側の処理は変更していません。</p>
  </section>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  const pdfUrl = {{ url_for('static', filename='sample.pdf') | tojson }};
  const ocrUrl = {{ url_for('ocr') | tojson }};
  const button = document.getElementById('ocr-button'), status = document.getElementById('ocr-status');
  const pageInput = document.getElementById('page-number'), previewWrap = document.getElementById('preview-wrap');
  const canvas = document.getElementById('preview-canvas'), table = document.getElementById('ocr-table'), tbody = document.getElementById('ocr-body');
  if (!window.pdfjsLib) { status.textContent = 'PDF解析ライブラリを読み込めませんでした。'; button.disabled = true; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function isNumberCandidate(text) {
    const normalized = String(text || '').trim();
    if (!/^\d{1,2}$/.test(normalized)) return false;
    const value = Number(normalized);
    return value >= 1 && value <= 99;
  }

  async function ocrTile(sourceCanvas, sx, sy, sw, sh, tileNo) {
    const tile = document.createElement('canvas');
    const targetLongSide = 3000;
    const factor = targetLongSide / Math.max(sw, sh);
    tile.width = Math.round(sw * factor); tile.height = Math.round(sh * factor);
    tile.getContext('2d').drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, tile.width, tile.height);
    status.textContent = `Google Visionで4分割OCR中… ${tileNo}/4`;
    const imageBase64 = tile.toDataURL('image/jpeg', 0.95).split(',', 2)[1];
    const response = await fetch(ocrUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ pageNumber:Number(pageInput.value), imageBase64 }) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `領域${tileNo}のOCRに失敗しました。`);
    return (Array.isArray(result.words) ? result.words : []).map(word => {
      const vertices = (word.vertices || []).map(v => ({ x: sx + (Number(v.x)||0) / factor, y: sy + (Number(v.y)||0) / factor }));
      return { text: word.text, vertices };
    });
  }

  async function runOcr() {
    button.disabled = true; table.hidden = true; previewWrap.hidden = true; tbody.replaceChildren();
    try {
      status.textContent = '対象ページを画像化しています…';
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      const pageNumber = Number(pageInput.value); pageInput.max = String(pdf.numPages);
      if (!Number.isInteger(pageNumber) || pageNumber < 1 || pageNumber > pdf.numPages) { status.textContent = `ページ番号は1〜${pdf.numPages}で指定してください。`; return; }
      const page = await pdf.getPage(pageNumber), base = page.getViewport({scale:1});
      const scale = Math.min(5, 4000 / Math.max(base.width, base.height)), viewport = page.getViewport({scale});
      canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
      const ctx = canvas.getContext('2d'); await page.render({canvasContext:ctx, viewport}).promise;
      const halfW = canvas.width / 2, halfH = canvas.height / 2;
      const tiles = [[0,0,halfW,halfH],[halfW,0,canvas.width-halfW,halfH],[0,halfH,halfW,canvas.height-halfH],[halfW,halfH,canvas.width-halfW,canvas.height-halfH]];
      const words = [];
      for (let i=0;i<tiles.length;i++) words.push(...await ocrTile(canvas, ...tiles[i], i+1));
      const candidates = words.filter(word => isNumberCandidate(word.text));
      ctx.lineWidth = Math.max(2, canvas.width/800); ctx.strokeStyle = '#1967d2';
      for (const word of candidates) {
        const xs=word.vertices.map(v=>v.x), ys=word.vertices.map(v=>v.y); if (!xs.length) continue;
        const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
        const pad = Math.max(3, Math.max(maxX-minX,maxY-minY)*0.35);
        ctx.strokeRect(minX-pad,minY-pad,Math.max(1,maxX-minX)+pad*2,Math.max(1,maxY-minY)+pad*2);
        const row=document.createElement('tr'); for (const value of [word.text,Math.round(minX),Math.round(minY),Math.round(maxX-minX),Math.round(maxY-minY)]) { const cell=document.createElement('td'); cell.textContent=String(value); row.appendChild(cell); } tbody.appendChild(row);
      }
      previewWrap.hidden=false; table.hidden=candidates.length===0;
      status.textContent=`ページ${pageNumber}: OCR ${words.length}件から、1〜99の番号候補を${candidates.length}件抽出しました。`;
    } catch(err) { console.error(err); status.textContent=`OCRエラー: ${err.message}`; }
    finally { button.disabled=false; }
  }
  button.addEventListener('click', runOcr);
})();
</script>
</body></html>
