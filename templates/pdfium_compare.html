<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFium比較</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124}main{max-width:1500px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.card{background:#fff;border:1px solid #dadce0;border-radius:12px;padding:14px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}label{display:grid;gap:5px;font-weight:600}select,input{min-height:42px;padding:0 10px;border:1px solid #bdc1c6;border-radius:8px;font:inherit}.button{min-height:42px;padding:0 14px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;color:#202124;font:inherit;cursor:pointer}.primary{background:#1967d2;color:#fff;border-color:#1967d2;font-weight:700}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{min-width:0}.panel h2{font-size:1rem;margin:0 0 8px}.frame{width:100%;height:76vh;border:1px solid #dadce0;border-radius:8px;background:#eee}.preview{width:100%;height:76vh;object-fit:contain;border:1px solid #dadce0;border-radius:8px;background:#eee}.status{margin:10px 0;min-height:1.5em}.error{color:#b3261e}@media(max-width:900px){.compare{grid-template-columns:1fr}.frame,.preview{height:60vh}}
</style>
</head>
<body><main>
<div class="top"><div><h1 style="margin:0">PDFレンダリング比較</h1><div style="color:#5f6368">原本PDFとPDFium画像を同じページで比較します。既存OCR・番号保存には影響しません。</div></div><a class="button" href="{{ url_for('projects_screen') }}">← 工事一覧へ</a></div>
<section class="card">
<div class="controls"><label>工事<select id="project">{% for p in projects %}<option value="{{ p.id }}" data-pdf="{{ p.pdf_url }}">{{ p.project_name }} / {{ p.pdf_name }}</option>{% endfor %}</select></label><label>ページ<input id="page" type="number" min="1" value="1" inputmode="numeric"></label><button class="button primary" id="compare" type="button">このページを比較</button></div>
<div id="status" class="status">工事とページを選んで比較してください。</div>
<div class="compare"><div class="panel"><h2>原本PDF（ブラウザ標準ビューア）</h2><iframe id="original" class="frame" title="原本PDF"></iframe></div><div class="panel"><h2>PDFium画像（長辺2,500px）</h2><img id="preview" class="preview" alt="PDFium比較画像"></div></div>
</section></main>
<script>
(()=>{const project=document.getElementById('project'),page=document.getElementById('page'),original=document.getElementById('original'),preview=document.getElementById('preview'),status=document.getElementById('status'),button=document.getElementById('compare');function run(){const opt=project.options[project.selectedIndex];if(!opt)return;const id=project.value,n=Math.max(1,Number(page.value)||1);page.value=n;status.className='status';status.textContent='PDFium画像を生成中…';original.src=`${opt.dataset.pdf}#page=${n}`;preview.removeAttribute('src');const src=`projects/${id}/pdfium-preview?page=${n}&longEdge=2500&t=${Date.now()}`;preview.onload=()=>{status.textContent='表示しました。文字・図形・色・欠落・黒帯などを原本PDFと比較してください。';};preview.onerror=async()=>{status.className='status error';try{const r=await fetch(src);const text=await r.text();status.textContent=`PDFium比較に失敗しました: ${text.slice(0,300)}`;}catch(e){status.textContent=`PDFium比較に失敗しました: ${e.message}`;}};preview.src=src;}button.onclick=run;project.onchange=run;if(project.options.length)run();else{status.className='status error';status.textContent='登録済み工事がありません。';}})();
</script></body></html>
