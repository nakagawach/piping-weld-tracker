<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ project_name }} - 図面エントリー</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124}main{max-width:1200px;margin:auto;padding:18px 14px 40px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.button{min-height:42px;padding:0 14px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;color:#202124;font:inherit;cursor:pointer}.primary{border-color:#1967d2;background:#1967d2;color:#fff;font-weight:700}.title{margin:0;font-size:1.35rem}.meta,.note{color:#5f6368}.meta{margin-top:4px}.card{background:#fff;border:1px solid #dadce0;border-radius:12px;padding:14px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}label{display:grid;gap:5px;font-weight:600}input[type=number]{width:90px;min-height:42px;padding:0 10px;border:1px solid #bdc1c6;border-radius:8px;font:inherit}.viewer{overflow:auto;max-height:76vh;border:1px solid #dadce0;border-radius:8px;background:#dfe3e8;padding:8px}.page-shell{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.16);width:max-content}.page-shell canvas{display:block;background:#fff}.number-layer{position:absolute;inset:0;cursor:pointer;touch-action:manipulation}.number-marker{position:absolute;border:2px solid #1967d2;pointer-events:none}.number-marker.manual{border-color:#188038}.number-label{position:absolute;left:0;bottom:100%;font:12px system-ui;color:#1967d2;white-space:nowrap;line-height:1.1}.number-marker.manual .number-label{color:#188038}.status{min-height:1.5em;margin:10px 0}.summary{margin:10px 0;padding:10px;border-radius:8px;background:#f7f8fa}.note{font-size:.9rem;line-height:1.6}.error{color:#b3261e}button:disabled{opacity:.5;cursor:wait}.zoom-readout{min-width:72px;text-align:center}@media(max-width:640px){.top{align-items:stretch;flex-direction:column}.top .button{width:100%}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1 class="title">図面エントリー</h1><div class="meta">{{ project_name }} / {{ pdf_name }}</div></div><button class="button" id="back" type="button">← 工事一覧へ</button></div>
  <section class="card">
    <div class="controls">
      <label>ページ<input id="page" type="number" min="1" value="1" inputmode="numeric"></label>
      <button class="button" id="prev" type="button">前へ</button><button class="button" id="next" type="button">次へ</button>
      <button class="button" id="zoomOut" type="button">－</button><button class="button zoom-readout" id="zoomReset" type="button">100%</button><button class="button" id="zoomIn" type="button">＋</button>
      <button class="button" id="ocr" type="button">OCR実行</button><button class="button" id="reset" type="button" disabled>読込時に戻す</button><button class="button primary" id="save" type="button" disabled>番号配置を確定保存</button>
    </div>
    <div class="status" id="status">PDFを読み込んでいます…</div><div class="summary" id="summary" hidden></div>
    <div class="viewer" id="viewer"><div class="page-shell" id="pageShell"><canvas id="pdfCanvas"></canvas><div class="number-layer" id="numberLayer"></div></div></div>
    <p class="note">A/Bテスト版：PDFは表示幅とズーム率に合わせて高密度再描画し、番号枠は別HTMLレイヤーで重ねています。OCR時だけ従来どおり6,000px画像を生成します。</p>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  const OCR_LONG_EDGE=6000,HIT_TARGET_CSS_PX=28;
  const pdfUrl={{ pdf_url|tojson }},ocrUrl={{ url_for('ocr')|tojson }},numberMapUrl={{ url_for('projects.get_project_number_map',project_id=project_id)|tojson }},projectsScreenUrl={{ url_for('projects_screen')|tojson }};
  const pageInput=document.getElementById('page'),status=document.getElementById('status'),summary=document.getElementById('summary'),viewer=document.getElementById('viewer'),pageShell=document.getElementById('pageShell'),pdfCanvas=document.getElementById('pdfCanvas'),numberLayer=document.getElementById('numberLayer');
  const prev=document.getElementById('prev'),next=document.getElementById('next'),ocrButton=document.getElementById('ocr'),resetButton=document.getElementById('reset'),saveButton=document.getElementById('save'),zoomOut=document.getElementById('zoomOut'),zoomReset=document.getElementById('zoomReset'),zoomIn=document.getElementById('zoomIn'),ocrCanvas=document.createElement('canvas');
  let pdf=null,currentPage=1,currentOcrWidth=1,currentOcrHeight=1,candidates=[],originalCandidates=[],nextId=1,busy=false,zoom=1;
  document.getElementById('back').onclick=()=>{window.location.href=projectsScreenUrl;};
  if(!window.pdfjsLib){status.textContent='PDF.jsを読み込めませんでした。';return;}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  function clone(list){return list.map(x=>({...x,bbox:{...x.bbox}}));}
  function normalizeDigits(value){return String(value??'').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));}
  function normalizedNumber(value){const t=normalizeDigits(value).trim();if(!/^\d{1,2}$/.test(t))return null;const n=Number(t);return n>=1&&n<=99?String(n):null;}
  function bbox(vertices){const xs=vertices.map(v=>Number(v.x)||0),ys=vertices.map(v=>Number(v.y)||0);if(!xs.length)return null;const x=Math.min(...xs),y=Math.min(...ys),x2=Math.max(...xs),y2=Math.max(...ys);return{x,y,w:Math.max(1,x2-x),h:Math.max(1,y2-y)};}
  function median(values){if(!values.length)return null;const a=[...values].sort((x,y)=>x-y),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
  function distanceSq(p,b){const cx=b.x+b.w/2,cy=b.y+b.h/2;return(p.x-cx)**2+(p.y-cy)**2;}
  function cssPxToOcrX(px){const r=numberLayer.getBoundingClientRect();return px*currentOcrWidth/Math.max(1,r.width);}function cssPxToOcrY(px){const r=numberLayer.getBoundingClientRect();return px*currentOcrHeight/Math.max(1,r.height);}function point(e){const r=numberLayer.getBoundingClientRect();return{x:(e.clientX-r.left)*currentOcrWidth/r.width,y:(e.clientY-r.top)*currentOcrHeight/r.height};}
  function findAt(p){const minX=cssPxToOcrX(HIT_TARGET_CSS_PX),minY=cssPxToOcrY(HIT_TARGET_CSS_PX);const hits=candidates.filter(item=>{const b=item.bbox,extraX=Math.max(0,(minX-b.w)/2),extraY=Math.max(0,(minY-b.h)/2);return p.x>=b.x-extraX&&p.x<=b.x+b.w+extraX&&p.y>=b.y-extraY&&p.y<=b.y+b.h+extraY;});if(!hits.length)return null;hits.sort((a,b)=>distanceSq(p,a.bbox)-distanceSq(p,b.bbox)||(a.bbox.w*a.bbox.h-b.bbox.w*b.bbox.h));return hits[0];}
  function referenceBoxes(center,number){const digits=number.length,same=candidates.filter(x=>x.source==='ocr'&&String(x.number).length===digits&&x.bbox.w>0&&x.bbox.h>0),pool=same.length?same:candidates.filter(x=>x.source==='ocr'&&x.bbox.w>0&&x.bbox.h>0);return pool.sort((a,b)=>distanceSq(center,a.bbox)-distanceSq(center,b.bbox)).slice(0,7);}
  function autoManualBox(center,number){const refs=referenceBoxes(center,number);let w=median(refs.map(x=>x.bbox.w)),h=median(refs.map(x=>x.bbox.h));if(!w||!h){w=cssPxToOcrX(14);h=cssPxToOcrY(14);}w=Math.max(1,w);h=Math.max(1,h);return{x:Math.max(0,Math.min(currentOcrWidth-w,center.x-w/2)),y:Math.max(0,Math.min(currentOcrHeight-h,center.y-h/2)),w,h};}
  function setBusy(value){busy=value;ocrButton.disabled=value;saveButton.disabled=value||!candidates.length;resetButton.disabled=value||!originalCandidates.length;prev.disabled=value||currentPage<=1;next.disabled=value||!pdf||currentPage>=pdf.numPages;pageInput.disabled=value;zoomOut.disabled=value;zoomIn.disabled=value;zoomReset.disabled=value;}
  function drawOverlay(){numberLayer.innerHTML='';for(const item of candidates){const b=item.bbox,manual=item.source==='manual',pad=(manual ? .08 : .35)*Math.max(b.w,b.h),el=document.createElement('div');el.className='number-marker'+(manual?' manual':'');el.style.left=`${Math.max(0,b.x-pad)/currentOcrWidth*100}%`;el.style.top=`${Math.max(0,b.y-pad)/currentOcrHeight*100}%`;el.style.width=`${Math.min(currentOcrWidth,b.w+pad*2)/currentOcrWidth*100}%`;el.style.height=`${Math.min(currentOcrHeight,b.h+pad*2)/currentOcrHeight*100}%`;const label=document.createElement('span');label.className='number-label';label.textContent=item.number;el.appendChild(label);numberLayer.appendChild(el);}summary.hidden=false;summary.textContent=`番号候補 ${candidates.length}件（OCR ${candidates.filter(x=>x.source==='ocr').length} / 手動 ${candidates.filter(x=>x.source==='manual').length}）`;saveButton.disabled=busy||!candidates.length;resetButton.disabled=busy||!originalCandidates.length;}
  async function renderViewer(pageNumber){const page=await pdf.getPage(pageNumber),base=page.getViewport({scale:1}),available=Math.max(320,viewer.clientWidth-18),fitScale=available/base.width,cssViewport=page.getViewport({scale:fitScale*zoom}),outputScale=Math.min(2.5,Math.max(2,window.devicePixelRatio||1));pdfCanvas.width=Math.floor(cssViewport.width*outputScale);pdfCanvas.height=Math.floor(cssViewport.height*outputScale);pdfCanvas.style.width=`${cssViewport.width}px`;pdfCanvas.style.height=`${cssViewport.height}px`;pageShell.style.width=`${cssViewport.width}px`;pageShell.style.height=`${cssViewport.height}px`;numberLayer.style.width=`${cssViewport.width}px`;numberLayer.style.height=`${cssViewport.height}px`;const ocrScale=OCR_LONG_EDGE/Math.max(base.width,base.height);currentOcrWidth=base.width*ocrScale;currentOcrHeight=base.height*ocrScale;await page.render({canvasContext:pdfCanvas.getContext('2d'),viewport:cssViewport,transform:[outputScale,0,0,outputScale,0,0]}).promise;drawOverlay();}
  async function renderOcr(pageNumber){const page=await pdf.getPage(pageNumber),base=page.getViewport({scale:1}),scale=OCR_LONG_EDGE/Math.max(base.width,base.height),vp=page.getViewport({scale});ocrCanvas.width=Math.ceil(vp.width);ocrCanvas.height=Math.ceil(vp.height);await page.render({canvasContext:ocrCanvas.getContext('2d'),viewport:vp}).promise;}
  async function loadNumberMap(pageNumber){const r=await fetch(`${numberMapUrl}?page=${pageNumber}`),data=await r.json();if(!r.ok)throw new Error(data.error||'番号マップを取得できませんでした。');return data;}
  async function loadPage(pageNumber){if(!pdf||busy)return;currentPage=Math.max(1,Math.min(pdf.numPages,Number(pageNumber)||1));pageInput.value=currentPage;setBusy(true);status.className='status';status.textContent=`${currentPage} / ${pdf.numPages} ページを読み込み中…`;try{const [data]=await Promise.all([loadNumberMap(currentPage),renderViewer(currentPage)]);candidates=(data.candidates||[]).map(x=>({id:nextId++,...x,bbox:{...x.bbox}}));originalCandidates=clone(candidates);drawOverlay();ocrButton.textContent=data.saved?'再OCR':'OCR実行';status.textContent=data.saved?`保存済み番号マップを復元しました（${candidates.length}件）`:`${currentPage} / ${pdf.numPages} ページ。未エントリーです。OCR実行してください。`;}catch(e){status.className='status error';status.textContent=e.message;}finally{setBusy(false);}}
  async function rerender(){if(!pdf||busy)return;setBusy(true);try{await renderViewer(currentPage);zoomReset.textContent=`${Math.round(zoom*100)}%`;}catch(e){status.className='status error';status.textContent=e.message;}finally{setBusy(false);}}
  async function runOcr(){if(!pdf||busy)return;setBusy(true);status.className='status';status.textContent='6,000pxで画像化しGoogle Vision OCRを実行中…';try{await renderOcr(currentPage);const imageBase64=ocrCanvas.toDataURL('image/jpeg',0.90).split(',')[1];ocrCanvas.width=1;ocrCanvas.height=1;const r=await fetch(ocrUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageNumber:currentPage,imageBase64})}),data=await r.json();if(!r.ok)throw new Error(data.error||'OCRに失敗しました。');candidates=[];for(const word of data.words||[]){const num=normalizedNumber(word.text),b=bbox(word.vertices||[]);if(num&&b)candidates.push({id:nextId++,number:num,source:'ocr',bbox:b});}originalCandidates=clone(candidates);drawOverlay();status.textContent=`OCR完了：番号候補 ${candidates.length}件。青枠を確認・補正してください。`;}catch(e){ocrCanvas.width=1;ocrCanvas.height=1;status.className='status error';status.textContent=e.message;}finally{setBusy(false);}}
  numberLayer.addEventListener('click',e=>{if(busy)return;const p=point(e),hit=findAt(p);if(hit){const value=prompt('番号を変更します。空欄で削除します。',hit.number);if(value===null)return;const t=normalizeDigits(value).trim();if(!t){candidates=candidates.filter(x=>x.id!==hit.id);drawOverlay();return;}const num=normalizedNumber(t);if(!num){alert('番号は1〜99で入力してください。');return;}hit.number=num;drawOverlay();return;}const value=prompt('この位置に追加する番号（1〜99）を入力してください。');if(value===null||!normalizeDigits(value).trim())return;const num=normalizedNumber(value);if(!num){alert('番号は1〜99で入力してください。');return;}candidates.push({id:nextId++,number:num,source:'manual',bbox:autoManualBox(p,num)});drawOverlay();});
  saveButton.onclick=async()=>{if(busy||!candidates.length)return;setBusy(true);status.className='status';status.textContent='番号配置を保存中…';try{const r=await fetch(numberMapUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageNumber:currentPage,candidates:candidates.map(({number,source,bbox})=>({number,source,bbox}))})}),data=await r.json();if(!r.ok)throw new Error(data.error||'保存に失敗しました。');originalCandidates=clone(candidates);ocrButton.textContent='再OCR';status.textContent=`番号配置を保存しました（${data.count}件）`;}catch(e){status.className='status error';status.textContent=e.message;}finally{setBusy(false);}};
  resetButton.onclick=()=>{candidates=clone(originalCandidates);drawOverlay();status.className='status';status.textContent='読込時の番号配置へ戻しました。';};prev.onclick=()=>loadPage(currentPage-1);next.onclick=()=>loadPage(currentPage+1);pageInput.onchange=()=>loadPage(pageInput.value);ocrButton.onclick=runOcr;zoomOut.onclick=()=>{zoom=Math.max(.5,zoom-.25);rerender();};zoomIn.onclick=()=>{zoom=Math.min(3,zoom+.25);rerender();};zoomReset.onclick=()=>{zoom=1;rerender();};
  pdfjsLib.getDocument(pdfUrl).promise.then(doc=>{pdf=doc;pageInput.max=doc.numPages;loadPage(1);}).catch(e=>{status.className='status error';status.textContent=`PDFを読み込めませんでした: ${e.message}`;});
})();
</script>
</body>
</html>
