<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ project_name }} - ページ一覧</title>
  <style>
    *{box-sizing:border-box}:root{color-scheme:light;--blue:#1967d2;--border:#dadce0;--bg:#f5f6f8;--text:#202124;--muted:#5f6368}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}main{max-width:1280px;margin:auto;padding:12px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}.title{margin:0;font-size:1.25rem}.meta{margin-top:3px;color:var(--muted);font-size:.82rem}.button{min-height:42px;padding:0 12px;border:1px solid #bdc1c6;border-radius:9px;background:#fff;color:var(--text);font-weight:700;cursor:pointer}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:11px;margin-bottom:10px}.columns{display:flex;gap:5px}.columns button{min-width:42px;height:38px;border:1px solid #bdc1c6;border-radius:8px;background:#fff;font-weight:800;cursor:pointer}.columns button.active{border-color:var(--blue);background:#e8f0fe;color:#174ea6}.hint{margin-left:auto;color:var(--muted);font-size:.78rem}.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}.page-card{min-width:0;border:2px solid transparent;border-radius:11px;background:#fff;padding:7px;cursor:pointer;box-shadow:0 1px 2px #0001}.page-card:hover{border-color:#aecbfa}.page-card.active{border-color:var(--blue);background:#f8fbff}.thumb-wrap{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#f1f3f4;border-radius:7px;overflow:hidden}.thumb{display:block;width:100%;height:100%;object-fit:contain}.placeholder{font-size:.76rem;color:#80868b;text-align:center;padding:8px}.label{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.8rem;font-weight:800}.loading-note{font-size:.72rem;color:var(--muted);font-weight:600}.error{color:#b3261e}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:640px){main{padding:8px}.top{align-items:flex-start}.title{font-size:1.1rem}.meta{font-size:.76rem}.toolbar{padding:6px;gap:5px}.hint{display:none}.columns{margin-left:auto}.columns button{min-width:38px;height:36px}.grid{gap:7px}.page-card{padding:5px}.label{font-size:.74rem}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><h1 class="title">ページ一覧</h1><div class="meta">{{ project_name }} / {{ pdf_name }}</div></div>
    <button class="button" id="back" type="button">← 戻る</button>
  </div>
  <div class="toolbar">
    <strong>表示</strong>
    <div class="columns" aria-label="列数切替">
      <button type="button" data-cols="1">1</button><button type="button" data-cols="2">2</button><button type="button" data-cols="3">3</button><button type="button" data-cols="4">4</button>
    </div>
    <span class="hint">サムネイルは画面表示後に順次読み込みます</span>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<script>
(() => {
  const projectId={{ project_id | tojson }};
  const pageCount={{ page_count | tojson }};
  const pdfiumPageUrl={{ url_for('projects.pdfium_page', project_id=project_id) | tojson }};
  const entryUrl={{ url_for('projects.project_entry', project_id=project_id) | tojson }};
  const progressUrl={{ url_for('progress.project_progress', project_id=project_id) | tojson }};
  const source={{ source | tojson }}==='progress'?'progress':'entry';
  const currentPage=Math.max(1,Number({{ current_page | tojson }})||1);
  const grid=document.getElementById('grid');
  const key=`weldThumbGridCols:${source}`;
  const defaultCols=matchMedia('(max-width:640px)').matches?2:3;
  let cols=defaultCols;try{const saved=Number(localStorage.getItem(key));if([1,2,3,4].includes(saved))cols=saved;}catch(_e){}
  const applyCols=n=>{cols=n;grid.style.setProperty('--cols',String(n));document.querySelectorAll('[data-cols]').forEach(b=>b.classList.toggle('active',Number(b.dataset.cols)===n));try{localStorage.setItem(key,String(n));}catch(_e){}};
  document.querySelector('.columns').addEventListener('click',e=>{const b=e.target.closest('[data-cols]');if(b)applyCols(Number(b.dataset.cols));});
  const targetUrl=p=>source==='progress'?`${progressUrl}?page=${p}`:`${entryUrl}?page=${p}`;
  document.getElementById('back').onclick=()=>location.href=targetUrl(currentPage);
  if(!pageCount){grid.innerHTML='<div class="empty">ページがありません。</div>';return;}
  const loadImage=card=>{const img=card.querySelector('img[data-src]');if(!img||img.src)return;img.src=img.dataset.src;img.onload=()=>{card.querySelector('.loading-note').textContent='';};img.onerror=()=>{card.querySelector('.loading-note').textContent='読込失敗';card.querySelector('.loading-note').classList.add('error');};};
  const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){loadImage(entry.target);observer.unobserve(entry.target);}}},{rootMargin:'240px 0px'}):null;
  const frag=document.createDocumentFragment();
  for(let p=1;p<=pageCount;p++){
    const card=document.createElement('button');card.type='button';card.className='page-card'+(p===currentPage?' active':'');card.dataset.page=String(p);card.innerHTML=`<div class="thumb-wrap"><img class="thumb" loading="lazy" decoding="async" alt="P${p} サムネイル" data-src="${pdfiumPageUrl}?page=${p}&longEdge=500&format=jpeg"><div class="placeholder">P${p}</div></div><div class="label"><span>P${p}</span><span class="loading-note">読込中…</span></div>`;
    const img=card.querySelector('img');img.style.display='none';img.addEventListener('load',()=>{img.style.display='block';const ph=card.querySelector('.placeholder');if(ph)ph.remove();});
    card.onclick=()=>location.href=targetUrl(p);frag.appendChild(card);if(observer)observer.observe(card);
  }
  grid.appendChild(frag);if(!observer){[...grid.children].slice(0,Math.min(8,pageCount)).forEach(loadImage);}applyCols(cols);
})();
</script>
</body>
</html>
